<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夕焼けフライト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* 全画面の3D空。上端にHUD、下寄せの操縦説明カード。夕焼けから夜へ移る一色固定のデザイン */
  :root {
    --dusk: #241c44;
    --panel: rgba(30, 22, 58, 0.74);
    --paper: #fff6ec;
    --muted: #d9c8e0;
    --sun: #ffb35c;
    --gold: #fff1a8;
    --rose: #ff6f86;
    --sky: #8fd8ff;
    --line: rgba(255, 246, 236, 0.18);
    --glowc: rgba(255, 190, 90, 0.55);
    --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--dusk);
    color: var(--paper);
    font-family: var(--body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    pointer-events: none;
    text-shadow: 0 1px 6px rgba(36, 28, 68, 0.6);
  }
  .label {
    display: block;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--muted);
  }
  .score b {
    display: block;
    font-family: var(--display); font-weight: 400;
    font-size: clamp(28px, 8vw, 40px); line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .combo { font-size: 13px; font-weight: 700; color: var(--sun); min-height: 1.2em; display: block; }
  .fuel { width: min(42vw, 180px); text-align: right; display: grid; justify-items: end; gap: 6px; }
  .bar {
    width: 100%; height: 10px; border-radius: 6px;
    background: rgba(255, 246, 236, 0.18); overflow: hidden;
    border: 1px solid var(--line);
  }
  .bar i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--rose), var(--sun));
    transform-origin: left center;
    transition: background 0.3s;
  }
  .bar.low i { background: var(--rose); animation: blink 0.5s steps(2) infinite; }
  .bar.gain { animation: gain 0.6s ease-out; }
  .bar.gain i { background: linear-gradient(90deg, var(--sun), var(--gold)); }
  @keyframes blink { 50% { opacity: 0.35; } }
  @keyframes gain {
    0% { box-shadow: 0 0 0 0 rgba(255, 210, 120, 0.9); transform: scaleY(1.6); }
    100% { box-shadow: 0 0 0 10px rgba(255, 210, 120, 0); transform: scaleY(1); }
  }
  .clock { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  .chip {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    padding: 3px 10px; border-radius: 999px;
    color: var(--sky); border: 1px solid var(--sky);
    background: rgba(143, 216, 255, 0.14);
  }

  #stick { position: fixed; left: 0; top: 0; pointer-events: none; }
  #stick .base, #stick .knob {
    position: absolute; border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  #stick .base { width: 140px; height: 140px; border: 2px solid rgba(255, 246, 236, 0.35); background: rgba(255, 246, 236, 0.06); }
  #stick .knob { width: 54px; height: 54px; background: rgba(255, 246, 236, 0.45); }

  .flash { position: fixed; inset: 0; background: var(--rose); opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .glow {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0) 45%, var(--glowc) 100%);
  }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute; transform: translate(-50%, -50%);
    display: grid; justify-items: center; gap: 2px;
    white-space: nowrap; text-shadow: 0 2px 10px rgba(36, 28, 68, 0.7);
    animation: pop 1s ease-out forwards;
  }
  .pop .big { font-family: var(--display); font-size: 26px; color: var(--sun); line-height: 1; }
  .pop .small { font-size: 13px; font-weight: 700; color: var(--paper); letter-spacing: 0.06em; }
  .pop.gold .big { color: var(--gold); font-size: 32px; }
  .pop.shield .big { color: var(--sky); font-size: 22px; }
  .pop.near .big { color: var(--paper); font-size: 18px; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
    15% { opacity: 1; transform: translate(-50%, -60%) scale(1.12); }
    30% { transform: translate(-50%, -70%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
  }

  .panel {
    position: fixed; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
    transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 360px;
    padding: 24px 22px 22px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 22px;
    display: grid; gap: 16px;
    text-align: center;
  }
  .eyebrow { font-size: 11px; letter-spacing: 0.3em; color: var(--sun); font-weight: 700; }
  .panel h1, .panel h2 {
    margin: 0; font-family: var(--display); font-weight: 400;
    line-height: 1.15; text-wrap: balance;
  }
  .panel h1 { font-size: clamp(32px, 9.5vw, 44px); }
  .panel h2 { font-size: 30px; }
  .howto { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; text-align: left; }
  .howto li { display: grid; grid-template-columns: 3.4em 1fr; gap: 10px; align-items: baseline; font-size: 13.5px; line-height: 1.5; }
  .howto b { font-size: 11px; letter-spacing: 0.1em; color: var(--sun); }
  .result { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .result div { padding: 10px 6px; border-radius: 14px; background: rgba(255, 246, 236, 0.07); }
  .result b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
  .reason { margin: 0; color: var(--muted); font-size: 14px; }
  .newbest { color: var(--sun); font-weight: 700; font-size: 13px; margin: 0; }

  .go {
    font: inherit; font-weight: 700; font-size: 17px; letter-spacing: 0.08em;
    color: var(--dusk);
    background: linear-gradient(180deg, #ffd27a, var(--sun));
    border: 0; border-radius: 999px;
    padding: 14px 20px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 140, 80, 0.35);
  }
  .go:active { transform: translateY(1px); }
  .go:focus-visible, .mute:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .mute {
    position: fixed; right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--paper); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; cursor: pointer;
  }
  .err { color: var(--muted); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) {
    .bar.low i, .bar.gain { animation: none; }
    .flash { transition: none; }
    .pop { animation-duration: 0.01s; animation-delay: 0.8s; }
  }
</style>

<div id="game"><canvas id="c"></canvas></div>

<div class="hud" id="hud" hidden>
  <div class="score">
    <span class="label">スコア</span>
    <b id="score">0</b>
    <span class="combo" id="combo"></span>
  </div>
  <div class="fuel">
    <span class="label">燃料</span>
    <div class="bar" id="fuelwrap"><i id="fuelbar"></i></div>
    <span class="clock" id="clock">18:00</span>
    <span class="chip" id="shieldChip" hidden>シールド</span>
  </div>
</div>

<div id="stick" hidden><span class="base"></span><span class="knob" id="knob"></span></div>
<div class="glow" id="glow"></div>
<div class="flash" id="flash"></div>
<div id="pops"></div>

<section class="panel" id="titlePanel">
  <div class="eyebrow">SUNSET FLIGHT</div>
  <h1>夕焼けフライト</h1>
  <ul class="howto">
    <li><b>操縦</b><span>画面のどこでもドラッグ。指を動かした方向に飛びます。</span></li>
    <li><b>燃料</b><span>光るリングをくぐると回復。金のリングは満タン。</span></li>
    <li><b>回転</b><span>ダブルタップでくるっと一回転。回転中は岩をすり抜けます。</span></li>
    <li><b>注意</b><span>浮いている岩にぶつかるとおしまい。青い玉を取るとシールドで一回だけ守れます。</span></li>
  </ul>
  <button class="go" id="startBtn" type="button">飛ぶ</button>
</section>

<section class="panel" id="overPanel" hidden>
  <div class="eyebrow">LANDED</div>
  <h2 id="overTitle">おつかれさま</h2>
  <p class="reason" id="overReason"></p>
  <div class="result">
    <div><span class="label">スコア</span><b id="finalScore">0</b></div>
    <div><span class="label">ベスト</span><b id="bestScore">0</b></div>
    <div><span class="label">くぐったリング</span><b id="finalRings">0</b></div>
    <div><span class="label">最大コンボ</span><b id="finalCombo">0</b></div>
  </div>
  <p class="newbest" id="newBest" hidden>ベスト更新</p>
  <button class="go" id="retryBtn" type="button">もう一回</button>
</section>

<button class="mute" id="muteBtn" type="button">音 ON</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (!window.THREE) {
    document.getElementById('titlePanel').innerHTML =
      '<h2>読み込めませんでした</h2><p class="err">3D描画のライブラリが読み込めませんでした。通信状態を確認して、ページを開き直してください。</p>';
    return;
  }

  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ---------- renderer / scene ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf7a882, 160, 900);
  const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 2400);

  const hemi = new THREE.HemisphereLight(0xffd9c4, 0x40336a, 0.95);
  scene.add(hemi);
  const sunLight = new THREE.DirectionalLight(0xffc28f, 1.05);
  sunLight.position.set(-120, 90, -300);
  scene.add(sunLight);

  // sky dome
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color() },
      mid: { value: new THREE.Color() },
      low: { value: new THREE.Color() }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP; void main(){ float h = vP.y; vec3 c = mix(low, mid, smoothstep(0.0, 0.22, h)); c = mix(c, top, smoothstep(0.22, 0.75, h)); gl_FragColor = vec4(c, 1.0); }'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat);
  scene.add(sky);

  // stars (fade in as the sun goes down)
  const STAR_N = 420;
  const starArr = new Float32Array(STAR_N * 3);
  for (let i = 0; i < STAR_N; i++) {
    const y = rand(0.06, 1), th = rand(0, Math.PI * 2), r = Math.sqrt(1 - y * y);
    starArr[i * 3] = Math.cos(th) * r * 1500; starArr[i * 3 + 1] = y * 1500; starArr[i * 3 + 2] = Math.sin(th) * r * 1500;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  const stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  scene.add(stars);

  // sun + glow, moon
  const sun = new THREE.Group();
  const sunDiscMat = new THREE.MeshBasicMaterial({ color: 0xfff0c8, fog: false, transparent: true });
  const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xffc27a, fog: false, transparent: true, opacity: 0.28, depthWrite: false });
  const sunGlow = new THREE.Mesh(new THREE.CircleGeometry(170, 40), sunGlowMat);
  sunGlow.position.z = -1;
  sun.add(sunGlow, new THREE.Mesh(new THREE.CircleGeometry(70, 40), sunDiscMat));
  scene.add(sun);
  const moonMat = new THREE.MeshBasicMaterial({ color: 0xf4f1ff, fog: false, transparent: true, opacity: 0 });
  const moon = new THREE.Mesh(new THREE.CircleGeometry(38, 36), moonMat);
  scene.add(moon);

  // sea
  const seaGeo = new THREE.PlaneGeometry(1800, 1800, 46, 46);
  seaGeo.rotateX(-Math.PI / 2);
  const seaMat = new THREE.MeshStandardMaterial({ color: 0x5a4c8c, flatShading: true, roughness: 0.85, metalness: 0 });
  const sea = new THREE.Mesh(seaGeo, seaMat);
  sea.position.z = -600;
  scene.add(sea);
  const seaPos = seaGeo.attributes.position;

  // ---------- plane ----------
  function makePlane() {
    const g = new THREE.Group();
    const white = new THREE.MeshStandardMaterial({ color: 0xfff4e6, flatShading: true, roughness: 0.5 });
    const red = new THREE.MeshStandardMaterial({ color: 0xe2475c, flatShading: true, roughness: 0.5 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x2c2552, flatShading: true, roughness: 0.3 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.3, 5, 8), white);
    body.rotation.x = -Math.PI / 2;
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.1, 8), red);
    nose.rotation.x = -Math.PI / 2; nose.position.z = -3.05;
    const wing = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.16, 1.5), white);
    wing.position.set(0, -0.1, -0.6);
    const tipL = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.18, 1.5), red);
    tipL.position.set(-3.6, -0.1, -0.6);
    const tipR = tipL.clone(); tipR.position.x = 3.6;
    const tail = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.12, 0.8), white);
    tail.position.set(0, 0.05, 2.2);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.3, 1.0), red);
    fin.position.set(0, 0.7, 2.25);
    const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6), dark);
    canopy.scale.set(0.9, 0.75, 1.6); canopy.position.set(0, 0.45, -1.0);
    const prop = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.18, 0.06), dark);
    prop.position.z = -3.65;
    g.add(body, nose, wing, tipL, tipR, tail, fin, canopy, prop);
    g.userData.prop = prop;
    g.userData.bank = 0;
    return g;
  }
  const plane = makePlane();
  scene.add(plane);
  const bubbleMat = new THREE.MeshBasicMaterial({ color: 0x9fdcff, transparent: true, opacity: 0.2, depthWrite: false });
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(4.6, 20, 14), bubbleMat);
  bubble.visible = false;
  plane.add(bubble);

  // ---------- scenery ----------
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xfff1ea, emissive: 0x6a4058, transparent: true, opacity: 0.9 });
  const puffGeo = new THREE.IcosahedronGeometry(1, 2);
  const clouds = [];
  function placeCloud(c, z) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const high = Math.random() < 0.35;
    c.position.set(high ? rand(-200, 200) : side * rand(70, 320), high ? rand(85, 140) : rand(15, 90), z);
  }
  for (let i = 0; i < 26; i++) {
    const c = new THREE.Group();
    const n = 4 + Math.floor(Math.random() * 4);
    for (let j = 0; j < n; j++) {
      const p = new THREE.Mesh(puffGeo, cloudMat);
      const s = rand(6, 14);
      p.scale.set(s * 1.3, s * 0.8, s);
      p.position.set(rand(-16, 16), rand(-3, 4), rand(-8, 8));
      c.add(p);
    }
    placeCloud(c, rand(-1500, 50));
    clouds.push(c); scene.add(c);
  }

  const islandMat = new THREE.MeshStandardMaterial({ color: 0x4d7d6a, flatShading: true, roughness: 0.9 });
  const sandMat = new THREE.MeshStandardMaterial({ color: 0xe9b98f, flatShading: true, roughness: 1 });
  const islands = [];
  function placeIsland(o, z) {
    const r = o.userData.r;
    o.position.set((Math.random() < 0.5 ? -1 : 1) * rand(r + 70, r + 380), 0, z);
  }
  for (let i = 0; i < 12; i++) {
    const o = new THREE.Group();
    const r = rand(18, 55), h = rand(18, 55);
    const hill = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), islandMat);
    hill.position.y = h / 2 - 1;
    const sand = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.15, r * 1.25, 3, 9), sandMat);
    o.add(sand, hill);
    o.userData.r = r * 1.25;
    placeIsland(o, rand(-1500, 50));
    islands.push(o); scene.add(o);
  }

  // wind streaks
  const WIND = 220;
  const windGeo = new THREE.BufferGeometry();
  const windArr = new Float32Array(WIND * 3);
  for (let i = 0; i < WIND; i++) {
    windArr[i * 3] = rand(-70, 70); windArr[i * 3 + 1] = rand(2, 75); windArr[i * 3 + 2] = rand(-320, 20);
  }
  windGeo.setAttribute('position', new THREE.BufferAttribute(windArr, 3));
  const wind = new THREE.Points(windGeo, new THREE.PointsMaterial({ color: 0xfff6ec, size: 0.35, transparent: true, opacity: 0.55, depthWrite: false }));
  scene.add(wind);

  // ---------- sparkle particles ----------
  const FX_N = 320;
  const fxPos = new Float32Array(FX_N * 3), fxCol = new Float32Array(FX_N * 3);
  const fxBase = new Float32Array(FX_N * 3), fxVel = new Float32Array(FX_N * 3), fxLife = new Float32Array(FX_N), fxMax = new Float32Array(FX_N);
  for (let i = 0; i < FX_N; i++) fxPos[i * 3 + 1] = -9999;
  const fxGeo = new THREE.BufferGeometry();
  fxGeo.setAttribute('position', new THREE.BufferAttribute(fxPos, 3));
  fxGeo.setAttribute('color', new THREE.BufferAttribute(fxCol, 3));
  const fx = new THREE.Points(fxGeo, new THREE.PointsMaterial({ size: 1.1, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  fx.frustumCulled = false;
  scene.add(fx);
  let fxNext = 0;
  const tmpC = new THREE.Color();
  // ring of sparks spreading outward from (x, y, z)
  function burst(x, y, z, count, colors, radius, spread) {
    for (let n = 0; n < count; n++) {
      const i = fxNext; fxNext = (fxNext + 1) % FX_N;
      const a = (n / count) * Math.PI * 2 + rand(-0.15, 0.15);
      const sp = spread * rand(0.55, 1.25);
      fxPos[i * 3] = x + Math.cos(a) * radius; fxPos[i * 3 + 1] = y + Math.sin(a) * radius; fxPos[i * 3 + 2] = z;
      fxVel[i * 3] = Math.cos(a) * sp; fxVel[i * 3 + 1] = Math.sin(a) * sp; fxVel[i * 3 + 2] = rand(-6, 10);
      tmpC.set(colors[n % colors.length]);
      fxBase[i * 3] = tmpC.r; fxBase[i * 3 + 1] = tmpC.g; fxBase[i * 3 + 2] = tmpC.b;
      fxMax[i] = fxLife[i] = rand(0.55, 1.0);
    }
  }
  function updateFx(dt, dz) {
    const damp = Math.exp(-dt * 2.2);
    for (let i = 0; i < FX_N; i++) {
      if (fxLife[i] <= 0) continue;
      fxLife[i] -= dt;
      if (fxLife[i] <= 0) { fxPos[i * 3 + 1] = -9999; fxCol[i * 3] = fxCol[i * 3 + 1] = fxCol[i * 3 + 2] = 0; continue; }
      fxVel[i * 3] *= damp; fxVel[i * 3 + 1] = fxVel[i * 3 + 1] * damp - dt * 6; fxVel[i * 3 + 2] *= damp;
      fxPos[i * 3] += fxVel[i * 3] * dt; fxPos[i * 3 + 1] += fxVel[i * 3 + 1] * dt; fxPos[i * 3 + 2] += fxVel[i * 3 + 2] * dt + dz;
      const k = Math.min(1, fxLife[i] / (fxMax[i] * 0.5));
      fxCol[i * 3] = fxBase[i * 3] * k; fxCol[i * 3 + 1] = fxBase[i * 3 + 1] * k; fxCol[i * 3 + 2] = fxBase[i * 3 + 2] * k;
    }
    fxGeo.attributes.position.needsUpdate = true;
    fxGeo.attributes.color.needsUpdate = true;
  }

  // ---------- rings, rocks, shield orbs ----------
  const RING_R = 6.5;
  const ringGeo = new THREE.TorusGeometry(RING_R, 0.7, 8, 28);
  const rings = [], ringPool = [];
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x5e4b72, flatShading: true, roughness: 0.95 });
  const mossMat = new THREE.MeshStandardMaterial({ color: 0x5f9a72, flatShading: true, roughness: 0.95 });
  const rocks = [], rockPool = [];
  const orbs = [], orbPool = [];
  const SPAWN_Z = -560;

  function spawnRing(path, gold) {
    const m = ringPool.pop() || new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2, transparent: true }));
    m.material.color.set(gold ? 0xfff4c4 : 0xffd271);
    m.material.emissive.set(gold ? 0xffc23d : 0xff8a3d);
    m.material.emissiveIntensity = gold ? 1.1 : 0.65;
    const s = gold ? 1.25 : 1;
    m.position.set(path.x, path.y, SPAWN_Z);
    m.scale.setScalar(s); m.material.opacity = 1;
    m.userData = { hit: false, fade: 0, done: false, gold: !!gold, s };
    rings.push(m); scene.add(m);
  }
  function spawnRock(avoid) {
    let x, y, tries = 0;
    do { x = rand(-46, 46); y = rand(10, 56); tries++; }
    while (tries < 12 && Math.hypot(x - avoid.x, y - avoid.y) < 20);
    let o = rockPool.pop();
    if (!o) {
      o = new THREE.Group();
      const rock = new THREE.Mesh(rockGeo, rockMat);
      const moss = new THREE.Mesh(rockGeo, mossMat);
      moss.scale.set(0.92, 0.35, 0.92); moss.position.y = 0.45;
      o.add(rock, moss);
    }
    const r = rand(3.5, 7.5);
    o.scale.set(r, r * 0.8, r);
    o.userData = { r, spin: rand(-0.6, 0.6), passed: false, dead: false };
    o.position.set(x, y, SPAWN_Z - rand(0, 60));
    rocks.push(o); scene.add(o);
  }
  function spawnOrb(path) {
    let o = orbPool.pop();
    if (!o) {
      o = new THREE.Group();
      o.add(new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0x8fd8ff, emissive: 0x2f8fff, emissiveIntensity: 0.9, roughness: 0.2 })));
      o.add(new THREE.Mesh(new THREE.IcosahedronGeometry(2.6, 1), new THREE.MeshBasicMaterial({ color: 0xdff4ff, wireframe: true, transparent: true, opacity: 0.7 })));
    }
    o.position.set(clamp(path.x + rand(-14, 14), -44, 44), clamp(path.y + rand(-10, 10), 10, 56), SPAWN_Z - 50);
    o.userData = { taken: false };
    orbs.push(o); scene.add(o);
  }
  function clearObstacles() {
    while (rings.length) { const m = rings.pop(); scene.remove(m); ringPool.push(m); }
    while (rocks.length) { const o = rocks.pop(); scene.remove(o); rockPool.push(o); }
    while (orbs.length) { const o = orbs.pop(); scene.remove(o); orbPool.push(o); }
  }

  // ---------- sound ----------
  let actx = null, muted = false;
  try { muted = localStorage.getItem('yuyake-flight-muted') === '1'; } catch (e) {}
  const muteBtn = $('muteBtn');
  const renderMute = () => { muteBtn.textContent = muted ? '音 OFF' : '音 ON'; };
  renderMute();
  muteBtn.addEventListener('click', () => {
    muted = !muted; renderMute();
    try { localStorage.setItem('yuyake-flight-muted', muted ? '1' : '0'); } catch (e) {}
  });
  function ensureAudio() {
    if (actx) return;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(freq, dur, type, vol, delay, toFreq) {
    if (!actx || muted) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
  const sfx = {
    ring(combo) {
      const f = SCALE[Math.min(combo - 1, SCALE.length - 1)];
      tone(f, 0.35, 'triangle', 0.18); tone(f * 1.5, 0.25, 'sine', 0.06);
    },
    gold() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.4, 'triangle', 0.16, i * 0.07)); },
    orb() { tone(660, 0.3, 'sine', 0.15); tone(990, 0.4, 'sine', 0.1, 0.08); },
    block() { tone(300, 0.35, 'square', 0.08, 0, 90); tone(1400, 0.25, 'sine', 0.08); },
    near() { tone(1500, 0.12, 'sine', 0.05); },
    roll() { tone(260, 0.45, 'sine', 0.09, 0, 820); },
    crash() { tone(180, 0.7, 'sawtooth', 0.2, 0, 40); }
  };

  // ---------- effects on screen ----------
  const popsEl = $('pops'), glowEl = $('glow'), flash = $('flash');
  const v3 = new THREE.Vector3();
  function pop(cls, big, small, x, y, z) {
    v3.set(x, y, z).project(camera);
    const el = document.createElement('div');
    el.className = 'pop ' + (cls || '');
    const w = window.innerWidth, h = window.innerHeight;
    el.style.left = clamp((v3.x * 0.5 + 0.5) * w, 90, w - 90) + 'px';
    el.style.top = clamp((-v3.y * 0.5 + 0.5) * h - 30, 140, h - 120) + 'px';
    const b = document.createElement('span'); b.className = 'big'; b.textContent = big; el.appendChild(b);
    if (small) { const s = document.createElement('span'); s.className = 'small'; s.textContent = small; el.appendChild(s); }
    popsEl.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  function glow(color) {
    glowEl.style.setProperty('--glowc', color);
    glowEl.style.transition = 'none';
    glowEl.style.opacity = '1';
    setTimeout(() => { glowEl.style.transition = 'opacity 0.55s ease-out'; glowEl.style.opacity = '0'; }, 70);
  }
  function fuelPulse() {
    fuelWrap.classList.remove('gain');
    void fuelWrap.offsetWidth;
    fuelWrap.classList.add('gain');
  }

  // ---------- state ----------
  const DAY_LEN = 150; // 秒：18:00 から 19:30 の夜まで
  const ROLL_T = 0.6;
  const S = {
    state: 'title', t: 0, dist: 0, speed: 45, boost: 0, fuel: 100, score: 0, bonus: 0,
    combo: 0, maxCombo: 0, ringCount: 0, spawned: 0,
    nextRing: 0, nextRock: 0, nextOrb: 0, crashT: 0, shake: 0, reason: '',
    shield: false, rollT: 0, rollCd: 0, rollDir: 1, day: 0
  };
  const P = { x: 0, y: 26, vx: 0, vy: 0 };
  const path = { x: 0, y: 28 };
  const input = { sx: 0, sy: 0, touch: null, keys: {}, lastTap: 0, tapX: 0, tapY: 0 };
  let best = 0;
  try { best = parseInt(localStorage.getItem('yuyake-flight-best') || '0', 10) || 0; } catch (e) {}

  const hud = $('hud'), scoreEl = $('score'), comboEl = $('combo'), fuelBar = $('fuelbar'), fuelWrap = $('fuelwrap');
  const clockEl = $('clock'), shieldChip = $('shieldChip');
  const stick = $('stick'), knob = $('knob');

  function startGame() {
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    clearObstacles();
    Object.assign(S, {
      state: 'play', t: 0, dist: 0, speed: 60, boost: 0, fuel: 100, score: 0, bonus: 0,
      combo: 0, maxCombo: 0, ringCount: 0, spawned: 0,
      nextRing: 0, nextRock: 600, nextOrb: 1300, crashT: 0, shake: 0,
      shield: false, rollT: 0, rollCd: 0
    });
    Object.assign(P, { x: 0, y: 26, vx: 0, vy: 0 });
    Object.assign(path, { x: 0, y: 28 });
    // 最初の数個は手前に置いて、すぐくぐれるようにする
    for (let k = 0; k < 4; k++) {
      path.x = clamp(path.x + rand(-14, 14), -30, 30);
      path.y = clamp(path.y + rand(-8, 8), 18, 40);
      spawnRing(path, false);
      rings[rings.length - 1].position.z = -150 - k * 105;
    }
    plane.rotation.set(0, 0, 0); plane.userData.bank = 0;
    $('titlePanel').hidden = true; $('overPanel').hidden = true; hud.hidden = false;
    comboEl.textContent = '';
    shieldChip.hidden = true; bubble.visible = false;
  }
  function crash(reason) {
    if (S.state !== 'play') return;
    S.state = 'crash'; S.crashT = 1.1; S.reason = reason;
    S.shake = reason === 'rock' ? 0.7 : 0;
    S.rollT = 0;
    if (reason === 'rock') {
      sfx.crash();
      flash.style.opacity = '0.45';
      setTimeout(() => { flash.style.opacity = '0'; }, 120);
      burst(P.x, P.y, 0, 40, [0xff6f86, 0xffb35c, 0xfff6ec], 1, 26);
    }
    endTouch();
  }
  function showOver() {
    S.state = 'over';
    hud.hidden = true;
    const final = S.score;
    const isBest = final > best;
    if (isBest) { best = final; try { localStorage.setItem('yuyake-flight-best', String(best)); } catch (e) {} }
    $('overTitle').textContent = S.reason === 'rock' ? 'ゴツン' : '燃料切れ';
    $('overReason').textContent = (S.reason === 'rock' ? '浮いている岩にぶつかりました。' : 'リングをくぐって燃料を補給しましょう。') + ' ' + clockText() + ' まで飛びました。';
    $('finalScore').textContent = final.toLocaleString();
    $('bestScore').textContent = best.toLocaleString();
    $('finalRings').textContent = S.ringCount;
    $('finalCombo').textContent = S.maxCombo;
    $('newBest').hidden = !isBest || final === 0;
    $('overPanel').hidden = false;
  }
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);

  function clockText() {
    const m = 18 * 60 + Math.round(clamp(S.t / DAY_LEN, 0, 1) * 90);
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }

  function doRoll() {
    if (S.state !== 'play' || S.rollT > 0 || S.rollCd > 0) return;
    const dir = Math.abs(P.vx) > 3 ? Math.sign(P.vx) : (Math.random() < 0.5 ? -1 : 1);
    S.rollT = ROLL_T; S.rollCd = ROLL_T + 0.6; S.rollDir = dir;
    P.vx += dir * 30;
    sfx.roll();
    burst(P.x, P.y, 1, 14, [0xfff6ec, 0xffd271], 3.5, 8);
  }

  // ---------- input ----------
  const STICK_R = 70;
  function endTouch() {
    input.touch = null; input.sx = 0; input.sy = 0; stick.hidden = true;
  }
  window.addEventListener('pointerdown', (e) => {
    if (S.state !== 'play' || e.target.closest('button')) return;
    const now = performance.now();
    if (now - input.lastTap < 300 && Math.hypot(e.clientX - input.tapX, e.clientY - input.tapY) < 70) {
      doRoll(); input.lastTap = 0;
    } else {
      input.lastTap = now; input.tapX = e.clientX; input.tapY = e.clientY;
    }
    input.touch = { id: e.pointerId, ox: e.clientX, oy: e.clientY };
    stick.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    knob.style.left = '0px'; knob.style.top = '0px';
    stick.hidden = false;
  });
  window.addEventListener('pointermove', (e) => {
    const t = input.touch;
    if (!t || e.pointerId !== t.id) return;
    let dx = e.clientX - t.ox, dy = e.clientY - t.oy;
    const len = Math.hypot(dx, dy);
    if (len > STICK_R) { dx *= STICK_R / len; dy *= STICK_R / len; }
    input.sx = dx / STICK_R; input.sy = -dy / STICK_R;
    knob.style.left = dx + 'px'; knob.style.top = dy + 'px';
  });
  const release = (e) => { if (input.touch && e.pointerId === input.touch.id) endTouch(); };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('keydown', (e) => {
    input.keys[e.key] = true;
    if ((e.key === 'Enter' || e.key === ' ') && (S.state === 'title' || S.state === 'over')) { e.preventDefault(); startGame(); return; }
    if (e.key === ' ' && S.state === 'play') { e.preventDefault(); doRoll(); }
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { input.keys[e.key] = false; });
  window.addEventListener('blur', () => { input.keys = {}; endTouch(); });

  function steer() {
    if (input.touch) return [input.sx, input.sy];
    const k = input.keys;
    const x = (k.ArrowRight || k.d || k.D ? 1 : 0) - (k.ArrowLeft || k.a || k.A ? 1 : 0);
    const y = (k.ArrowUp || k.w || k.W ? 1 : 0) - (k.ArrowDown || k.s || k.S ? 1 : 0);
    return [x, y];
  }

  // ---------- sunset → night palette ----------
  const PAL = {
    top:   [0x241c44, 0x060a20],
    mid:   [0xc0638c, 0x1b2152],
    low:   [0xf7a882, 0x3d3a70],
    sea:   [0x5a4c8c, 0x1d2150],
    cloud: [0x6a4058, 0x16183a],
    hemi:  [0xffd9c4, 0x8c96d8],
    light: [0xffc28f, 0x9fb0ff]
  };
  for (const k in PAL) PAL[k] = PAL[k].map((c) => new THREE.Color(c));
  const mix = (target, k, p) => target.copy(PAL[k][0]).lerp(PAL[k][1], p);
  function applyDay(p) {
    mix(skyMat.uniforms.top.value, 'top', p);
    mix(skyMat.uniforms.mid.value, 'mid', p);
    mix(skyMat.uniforms.low.value, 'low', p);
    mix(scene.fog.color, 'low', p);
    mix(seaMat.color, 'sea', p);
    mix(cloudMat.emissive, 'cloud', p);
    mix(hemi.color, 'hemi', p);
    mix(sunLight.color, 'light', p);
    hemi.intensity = lerp(0.95, 0.6, p);
    sunLight.intensity = lerp(1.05, 0.45, p);
    starMat.opacity = smooth(0.35, 1, p);
    moonMat.opacity = smooth(0.5, 1, p);
    sunDiscMat.opacity = 1 - smooth(0.55, 0.95, p);
    sunGlowMat.opacity = 0.28 * (1 - smooth(0.4, 0.95, p));
  }

  // ---------- loop ----------
  let baseFov = 60;
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // 縦長画面では横の視野が狭くなりすぎないよう縦の画角を広げる
    baseFov = camera.aspect < 1 ? Math.min(80, 2 * Math.atan(Math.tan(25 * Math.PI / 180) / camera.aspect) * 180 / Math.PI) : 60;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  const camPos = new THREE.Vector3(0, 32, 18);
  const camTarget = new THREE.Vector3();
  let last = performance.now(), T = 0, lookY = 14, dayTarget = 0;

  function hitRing(m) {
    const d = m.userData;
    d.hit = true;
    S.combo += 1; S.ringCount += 1;
    S.maxCombo = Math.max(S.maxCombo, S.combo);
    const mult = Math.min(S.combo, 5);
    const x = m.position.x, y = m.position.y;
    if (d.gold) {
      const pts = 200 * mult;
      S.bonus += pts; S.fuel = 100; S.boost = 55;
      sfx.gold();
      burst(x, y, 0, 70, [0xfff1a8, 0xffffff, 0xffb35c, 0xff9fd0], RING_R * d.s, 30);
      glow('rgba(255, 236, 150, 0.7)');
      pop('gold', '+' + pts, '燃料満タン', P.x, P.y + 5, 0);
    } else {
      const pts = 20 * mult;
      S.bonus += pts; S.fuel = Math.min(100, S.fuel + 15);
      S.boost = Math.min(40, S.boost + 18);
      sfx.ring(S.combo);
      burst(x, y, 0, 36, [0xffd271, 0xffb35c, 0xfff6ec], RING_R, 18 + mult * 2);
      glow('rgba(255, 190, 90, 0.5)');
      pop('', '+' + pts, '燃料 +15', P.x, P.y + 5, 0);
    }
    fuelPulse();
    comboEl.textContent = S.combo > 1 ? S.combo + ' コンボ ×' + mult : '';
  }

  function update(dt) {
    T += dt;
    let speed;

    if (S.state === 'play') {
      S.t += dt;
      S.boost = Math.max(0, S.boost - dt * 22);
      S.speed = Math.min(140, 60 + S.t * 1.1);
      speed = S.speed + S.boost;
      S.dist += speed * dt;
      S.rollT = Math.max(0, S.rollT - dt);
      S.rollCd = Math.max(0, S.rollCd - dt);

      const [sx, sy] = steer();
      P.vx = lerp(P.vx, sx * 38, 1 - Math.exp(-dt * (S.rollT > 0 ? 1.5 : 5)));
      P.vy = lerp(P.vy, sy * 30, 1 - Math.exp(-dt * 5));
      P.x = clamp(P.x + P.vx * dt, -50, 50);
      P.y = clamp(P.y + P.vy * dt, 7, 62);

      S.fuel -= dt * (4 + S.t * 0.035);
      if (S.fuel <= 0) { S.fuel = 0; crash('fuel'); }

      if (S.dist >= S.nextRing) {
        path.x = clamp(path.x + rand(-24, 24), -42, 42);
        path.y = clamp(path.y + rand(-15, 15), 12, 54);
        S.spawned += 1;
        spawnRing(path, S.spawned >= 6 && Math.random() < 0.1);
        S.nextRing += 105;
      }
      if (S.dist >= S.nextRock) {
        spawnRock(path);
        if (Math.random() < Math.min(0.6, S.t / 90)) spawnRock(path);
        S.nextRock += Math.max(70, 220 - S.t * 2.2) * rand(0.8, 1.2);
      }
      if (S.dist >= S.nextOrb) {
        if (!S.shield) spawnOrb(path);
        S.nextOrb += rand(1500, 2200);
      }
      S.score = Math.floor(S.dist / 10) + S.bonus;
      dayTarget = clamp(S.t / DAY_LEN, 0, 1);
    } else if (S.state === 'crash') {
      S.crashT -= dt;
      speed = Math.max(0, (S.speed + S.boost) * (S.crashT / 1.1));
      P.vy -= dt * 30;
      P.y = Math.max(3, P.y + P.vy * dt);
      P.x += P.vx * dt;
      if (S.crashT <= 0) showOver();
    } else {
      // title / over: gentle autopilot cruise
      speed = 45;
      P.vx = Math.cos(T * 0.6) * 10;
      P.vy = Math.sin(T * 0.9) * 5;
      P.x = Math.sin(T * 0.6) * 16;
      P.y = 26 + Math.sin(T * 0.9) * 5;
      if (S.state === 'title') dayTarget = 0;
    }
    S.day = lerp(S.day, dayTarget, 1 - Math.exp(-dt * 1.5));
    applyDay(S.day);

    const dz = speed * dt;

    // plane pose
    if (S.state === 'crash') {
      plane.rotation.z += dt * (S.reason === 'rock' ? 9 : 2);
      plane.rotation.x = lerp(plane.rotation.x, -0.6, dt * 2);
    } else {
      const k = 1 - Math.exp(-dt * 8);
      plane.userData.bank = lerp(plane.userData.bank, -clamp(P.vx, -40, 40) * 0.022, k);
      let roll = 0;
      if (S.rollT > 0) {
        const f = 1 - S.rollT / ROLL_T;
        roll = -S.rollDir * Math.PI * 2 * (f < 0.5 ? 2 * f * f : 1 - 2 * (1 - f) * (1 - f));
      }
      plane.rotation.z = plane.userData.bank + roll;
      plane.rotation.x = lerp(plane.rotation.x, P.vy * 0.018, k);
      plane.rotation.y = lerp(plane.rotation.y, -clamp(P.vx, -40, 40) * 0.006, k);
    }
    plane.position.set(P.x, P.y, 0);
    plane.userData.prop.rotation.z += dt * (8 + speed * 0.4);
    bubble.visible = S.shield && S.state === 'play';
    if (bubble.visible) { bubbleMat.opacity = 0.16 + Math.sin(T * 5) * 0.06; bubble.scale.setScalar(1 + Math.sin(T * 3) * 0.04); }

    // rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const m = rings[i];
      const d = m.userData;
      const prevZ = m.position.z;
      m.position.z += dz;
      m.rotation.z += dt * (d.gold ? 2.2 : 0.8);
      if (d.hit) {
        d.fade += dt;
        const f = d.fade / 0.45;
        m.scale.setScalar(d.s * (1 + f * 1.4));
        m.material.opacity = Math.max(0, 1 - f);
        m.material.emissiveIntensity = (d.gold ? 1.1 : 0.65) + (1 - f) * 1.5;
        if (f >= 1) d.done = true;
      } else if (S.state === 'play' && prevZ < 0 && m.position.z >= 0) {
        if (Math.hypot(m.position.x - P.x, m.position.y - P.y) < RING_R * d.s - 0.4) {
          hitRing(m);
        } else {
          S.combo = 0;
          comboEl.textContent = '';
        }
      }
      if (d.done || m.position.z > 40) {
        rings.splice(i, 1); scene.remove(m); ringPool.push(m);
      }
    }

    // shield orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      const prevZ = o.position.z;
      o.position.z += dz;
      o.rotation.y += dt * 1.5; o.rotation.x += dt * 0.7;
      if (S.state === 'play' && !o.userData.taken && prevZ < 0 && o.position.z >= 0 &&
          Math.hypot(o.position.x - P.x, o.position.y - P.y) < 5) {
        o.userData.taken = true;
        S.shield = true; shieldChip.hidden = false;
        sfx.orb();
        burst(o.position.x, o.position.y, 0, 30, [0x8fd8ff, 0xdff4ff, 0xffffff], 2, 16);
        glow('rgba(120, 200, 255, 0.55)');
        pop('shield', 'シールド', '岩から一回守ります', P.x, P.y + 5, 0);
      }
      if (o.userData.taken || o.position.z > 40) { orbs.splice(i, 1); scene.remove(o); orbPool.push(o); }
    }

    // rocks
    for (let i = rocks.length - 1; i >= 0; i--) {
      const o = rocks[i];
      const d = o.userData;
      const prevZ = o.position.z;
      o.position.z += dz;
      o.rotation.y += dt * d.spin;
      if (S.state === 'play' && !d.dead) {
        const dist = Math.hypot(o.position.x - P.x, (o.position.y - P.y) * 1.15, o.position.z);
        const hitR = d.r * 0.85 + 1.4;
        if (dist < hitR && S.rollT <= 0) {
          if (S.shield) {
            S.shield = false; shieldChip.hidden = true; d.dead = true;
            S.shake = 0.3;
            sfx.block();
            burst(o.position.x, o.position.y, o.position.z, 34, [0x8fd8ff, 0x9a86b8, 0xdff4ff], d.r * 0.5, 22);
            glow('rgba(120, 200, 255, 0.6)');
            pop('shield', 'ガード', 'シールドが守りました', P.x, P.y, 0);
          } else {
            crash('rock');
          }
        } else if (!d.passed && prevZ < 0 && o.position.z >= 0) {
          d.passed = true;
          const side = Math.hypot(o.position.x - P.x, (o.position.y - P.y) * 1.15);
          if (side < hitR + 5) {
            S.bonus += 30;
            sfx.near();
            pop('near', S.rollT > 0 ? 'すり抜け +30' : 'ニアミス +30', '', P.x, P.y + 3, 0);
          }
        }
      }
      if (d.dead || o.position.z > 40) { rocks.splice(i, 1); scene.remove(o); rockPool.push(o); }
    }

    updateFx(dt, dz);

    // scenery
    for (const c of clouds) { c.position.z += dz * 0.9; if (c.position.z > 80) placeCloud(c, c.position.z - 1600); }
    for (const o of islands) { o.position.z += dz; if (o.position.z > 120) placeIsland(o, o.position.z - 1600); }
    for (let i = 0; i < WIND; i++) {
      const k = i * 3 + 2;
      windArr[k] += dz * 1.3;
      if (windArr[k] > 20) { windArr[k] -= 340; windArr[k - 2] = rand(-70, 70) + P.x * 0.5; windArr[k - 1] = rand(2, 75); }
    }
    windGeo.attributes.position.needsUpdate = true;

    // sea waves (phase scrolls with distance traveled)
    const off = S.state === 'title' || S.state === 'over' ? T * 45 : S.dist;
    for (let i = 0; i < seaPos.count; i++) {
      const x = seaPos.getX(i), z = seaPos.getZ(i);
      seaPos.setY(i, Math.sin(x * 0.03 + T * 1.1) * 1.8 + Math.cos((z - off) * 0.04 + T * 0.7) * 1.8);
    }
    seaPos.needsUpdate = true;

    // camera
    const flying = S.state === 'play' || S.state === 'crash';
    camTarget.set(P.x, P.y + 6, 20);
    camPos.lerp(camTarget, 1 - Math.exp(-dt * 4));
    camera.position.copy(camPos);
    if (S.shake > 0) {
      S.shake = Math.max(0, S.shake - dt);
      camera.position.x += rand(-1, 1) * S.shake * 2;
      camera.position.y += rand(-1, 1) * S.shake * 2;
    }
    lookY = lerp(lookY, flying ? P.y + 1 : P.y - 24, 1 - Math.exp(-dt * 3));
    camera.lookAt(camPos.x, lookY, -24);
    const fov = baseFov + clamp((speed - 45) * 0.12, 0, 16);
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = lerp(camera.fov, fov, 1 - Math.exp(-dt * 3)); camera.updateProjectionMatrix(); }

    const cp = camera.position;
    sky.position.copy(cp);
    stars.position.copy(cp);
    sun.position.set(cp.x - 260, cp.y + 40 - S.day * 170, cp.z - 1500);
    sun.lookAt(cp);
    moon.position.set(cp.x + 380, cp.y + 330, cp.z - 1400);
    moon.lookAt(cp);

    // HUD
    if (S.state === 'play') {
      scoreEl.textContent = S.score.toLocaleString();
      fuelBar.style.transform = 'scaleX(' + (S.fuel / 100).toFixed(3) + ')';
      fuelWrap.classList.toggle('low', S.fuel < 25);
      clockEl.textContent = clockText();
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();
</script>
