<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>かえちゃんごう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  /* 全画面の横スクロール線路。上にスター数と道のり、下寄せに大きなボタン。昼の空の一色固定デザイン */
  :root {
    --ink: #1d2b4f;
    --paper: #ffffff;
    --sky: #7cc8ff;
    --blue: #1f5fd1;
    --orange: #ff8a1f;
    --gold: #ffd23f;
    --red: #e8463a;
    --cream: #fff7e3;
    --shade: rgba(29, 43, 79, 0.18);
    --display: "Mochiy Pop One", "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }

  /* ---- HUD ---- */
  .hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 72px 0 16px;
    display: flex; align-items: center; gap: 14px;
    pointer-events: none;
  }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 14px 4px 10px; box-shadow: 0 4px 0 var(--ink);
    font-family: var(--display); font-size: 26px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .pill .ico { color: var(--gold); -webkit-text-stroke: 1.5px #c98a00; font-size: 28px; }
  .pill.bump { animation: bump 0.25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  .track {
    position: relative; flex: 1; min-width: 0; height: 16px; margin-top: 18px;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  }
  .track-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--orange); border-radius: 999px; }
  .mark {
    position: absolute; top: -26px; transform: translateX(-50%);
    font-size: 18px; line-height: 1;
  }
  .mark::after {
    content: ""; position: absolute; left: 50%; top: 24px; width: 8px; height: 8px;
    transform: translateX(-50%); border-radius: 50%; background: var(--ink);
  }
  .track-train {
    position: absolute; top: 50%; left: 0; width: 30px; height: 16px;
    transform: translate(-50%, -50%);
    background: var(--paper); border: 3px solid var(--ink);
    border-radius: 4px 14px 6px 4px;
    box-shadow: inset 0 -5px 0 var(--blue);
  }
  .mute {
    position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 10px);
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
    font-size: 22px; line-height: 1; display: grid; place-items: center; padding: 0;
  }

  /* ---- 共通ボタン ---- */
  .big-btn {
    font-family: var(--display); font-size: clamp(22px, 6.2vw, 34px); line-height: 1.15;
    word-break: keep-all; overflow-wrap: anywhere;
    background: var(--orange); color: var(--paper);
    border: 4px solid var(--ink); border-radius: 999px;
    padding: 16px 34px; box-shadow: 0 7px 0 var(--ink);
    text-shadow: 0 2px 0 rgba(29, 43, 79, 0.35);
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .big-btn.blue { background: var(--blue); }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }

  /* ---- タイトル ---- */
  .title {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 7vh) 16px 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; pointer-events: none;
  }
  .title > * { pointer-events: auto; }
  .tag {
    font-family: var(--body); font-weight: 900; font-size: 17px; letter-spacing: 0.08em;
    background: var(--red); color: var(--paper);
    border: 3px solid var(--ink); border-radius: 8px; padding: 5px 14px;
    box-shadow: 0 4px 0 var(--ink); transform: rotate(-4deg);
  }
  .logo {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(40px, 11.5vw, 92px); line-height: 1.05; letter-spacing: 0.01em;
    white-space: nowrap;
    text-shadow:
      3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
      2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink),
      0 8px 0 var(--ink);
  }
  .logo .k { color: var(--orange); }
  .logo .g { color: var(--paper); }
  .lead {
    font-weight: 900; font-size: clamp(16px, 4.6vw, 21px);
    background: rgba(255, 255, 255, 0.9); border-radius: 999px; padding: 6px 16px;
  }
  .hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .hint {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
    padding: 5px 12px; font-weight: 900; font-size: 15px;
  }
  .record { font-weight: 900; font-size: 14px; background: rgba(255, 255, 255, 0.75); border-radius: 10px; padding: 3px 10px; }

  /* ---- えき ---- */
  .station {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 74px) 16px 0;
    display: flex; justify-content: center; pointer-events: none;
  }
  .card {
    pointer-events: auto; width: 100%; max-width: 480px;
    background: var(--cream); border: 4px solid var(--ink); border-radius: 26px;
    box-shadow: 0 8px 0 var(--ink); padding: 18px 16px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
    animation: drop 0.4s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes drop { from { transform: translateY(-40px); opacity: 0; } }
  .sign {
    width: 100%; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    padding: 10px 10px 8px;
  }
  .sign-name { font-family: var(--display); font-size: clamp(32px, 10vw, 46px); line-height: 1.15; }
  .sign-bar { height: 10px; margin: 6px -10px; background: var(--blue); border-block: 3px solid var(--ink); }
  .sign-sub { font-weight: 900; font-size: 16px; }
  .stamp-title { font-weight: 900; font-size: 15px; letter-spacing: 0.06em; }
  .stamps { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .slot {
    width: 50px; height: 50px; border-radius: 50%;
    border: 3px dashed rgba(29, 43, 79, 0.35);
    display: grid; place-items: center; font-size: 26px;
  }
  .slot.on {
    border: 3px solid var(--red); background: var(--paper);
    box-shadow: inset 0 0 0 3px rgba(232, 70, 58, 0.25);
  }
  .slot.new { animation: stamp 0.45s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: 0.35s; }
  @keyframes stamp {
    from { transform: scale(2.4) rotate(-25deg); opacity: 0; }
    to { transform: scale(1) rotate(-8deg); opacity: 1; }
  }

  /* ---- おばけたいじ ---- */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 6vh);
    display: flex; justify-content: center; pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .drum {
    width: 150px; height: 150px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle at 50% 45%, #fff3d6 0 52%, #f2d9a4 53% 60%, var(--red) 61%);
    border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
    font-family: var(--display); font-size: 34px; color: var(--ink);
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .drum.hit { transform: translateY(5px) scale(0.96); box-shadow: 0 3px 0 var(--ink); }

  /* ---- ゴール ---- */
  .end {
    position: fixed; inset: 0; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .cert {
    width: 100%; max-width: 480px; background: var(--cream);
    border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 8px 0 var(--ink);
    padding: 10px; animation: drop 0.5s cubic-bezier(.2, 1.4, .4, 1);
  }
  .cert-in {
    border: 3px double var(--orange); border-radius: 10px; padding: 18px 14px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    position: relative;
  }
  .cert h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 6.2vw, 32px); color: var(--blue); word-break: keep-all; }
  .cert .to { font-family: var(--display); font-size: clamp(26px, 8vw, 36px); }
  .cert .to small { font-family: var(--body); font-weight: 900; font-size: 18px; margin-left: 6px; }
  .cert p { margin: 0; font-weight: 900; font-size: 16px; line-height: 1.75; }
  .cert .got { font-family: var(--display); font-size: 24px; }
  .cert .got .ico { color: var(--gold); -webkit-text-stroke: 1.5px #c98a00; }
  .cert .foot { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; font-weight: 900; font-size: 15px; }
  .hanko {
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--red); color: var(--red);
    display: grid; place-items: center; font-family: var(--display); font-size: 12px; line-height: 1.2;
    white-space: nowrap; text-align: center;
    transform: rotate(-10deg);
  }

  @media (max-height: 520px) {
    .title { padding-top: calc(env(safe-area-inset-top, 0px) + 10px); gap: 8px; }
    .logo { font-size: clamp(36px, 9vh, 56px); }
    .hints, .record { display: none; }
    .station { padding-top: calc(env(safe-area-inset-top, 0px) + 60px); }
    .card { padding: 10px 14px 14px; gap: 8px; max-width: 560px; }
    .sign-name { font-size: 30px; }
    .slot { width: 42px; height: 42px; font-size: 22px; }
    .big-btn { padding: 10px 28px; font-size: 24px; }
    .bottom { justify-content: flex-end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
    .drum { width: 120px; height: 120px; font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .card, .cert, .slot.new { animation: none; }
  }

  /* ---- たたかい ---- */
  .fight { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .gauge {
    display: flex; align-items: center; gap: 8px;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 12px 4px 10px; box-shadow: 0 4px 0 var(--ink);
    font-weight: 900; font-size: 14px;
  }
  .gauge-bar { position: relative; width: 150px; height: 14px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: #e7edf6; }
  .gauge-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #33d6ff, #7ff3ff); transition: width 0.12s; }
  .gauge.full .gauge-fill { background: linear-gradient(90deg, var(--gold), #fff3a0, var(--gold)); animation: shine 0.6s linear infinite; }
  @keyframes shine { 50% { filter: brightness(1.25); } }
  .fight-row { display: flex; align-items: center; gap: 14px; }
  .hissatsu {
    width: 118px; height: 118px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle at 50% 40%, #fff7c2, var(--gold) 55%, #f0a400);
    border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
    font-family: var(--display); font-size: 22px; line-height: 1.15; color: var(--ink);
    word-break: keep-all;
  }
  .hissatsu:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--ink); }
  @media (max-height: 520px) {
    .fight { gap: 6px; }
    .hissatsu { width: 96px; height: 96px; font-size: 18px; }
    .gauge-bar { width: 110px; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="かえちゃんごうの せんろ"></canvas>

<div class="hud" id="hud" hidden>
  <div class="pill" id="starPill"><span class="ico">★</span><span id="starN">0</span></div>
  <div class="track" id="track"><div class="track-fill" id="trackFill"></div><div class="track-train" id="trackTrain"></div></div>
</div>
<button class="mute" id="mute" aria-label="おと">🔊</button>

<section class="title" id="titleScr">
  <div class="tag">かえちゃん せんよう</div>
  <h1 class="logo"><span class="k">かえちゃん</span><span class="g">ごう</span></h1>
  <div class="lead">リニアモーターカーで ゴールまで いこう！</div>
  <button class="big-btn pulse" id="startBtn">しゅっぱつ しんこう！</button>
  <div class="hints">
    <span class="hint">タッチで ジャンプ</span>
    <span class="hint">2かい タッチで くるりん</span>
  </div>
  <div class="record" id="record" hidden></div>
</section>

<section class="station" id="stationScr" hidden>
  <div class="card">
    <div class="sign">
      <div class="sign-name" id="sName">えき</div>
      <div class="sign-bar"></div>
      <div class="sign-sub" id="sSub"></div>
    </div>
    <div class="stamp-title">かえちゃんの スタンプカード</div>
    <div class="stamps" id="stamps"></div>
    <button class="big-btn pulse" id="departBtn">しゅっぱつ！</button>
  </div>
</section>

<div class="bottom" id="henkeiWrap" hidden><button class="big-btn blue pulse" id="henkeiBtn">へんけい！</button></div>
<div class="bottom" id="drumWrap" hidden>
  <div class="fight">
    <div class="gauge" id="gauge">ひっさつ<span class="gauge-bar"><span class="gauge-fill" id="gaugeFill"></span></span></div>
    <div class="fight-row">
      <button class="drum" id="drum" aria-label="こうげき">ドン！</button>
      <button class="hissatsu pulse" id="hissatsuBtn" hidden>ひっさつ<br>ビーム！</button>
    </div>
  </div>
</div>
<div class="bottom" id="nextWrap" hidden><button class="big-btn pulse" id="nextBtn">しゅっぱつ！</button></div>

<section class="end" id="endScr" hidden>
  <div class="cert">
    <div class="cert-in">
      <h2>うんてんし にんていしょう</h2>
      <div class="to">かえちゃん<small>どの</small></div>
      <p>リニア「かえちゃんごう」を<br>ゴールまで うんてん しました。<br>わるものを 3たい やっつけました。<br>とても じょうず でした。</p>
      <div class="got"><span class="ico">★</span> <span id="endStars">0</span>こ あつめた</div>
      <div class="stamps" id="endStamps"></div>
      <div class="foot"><span id="endDate"></span><span class="hanko">かえちゃん<br>ごう</span></div>
      <div class="record" id="endRecord"></div>
    </div>
  </div>
  <button class="big-btn pulse" id="againBtn">もういっかい！</button>
</section>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");

  // ---------- わるもの ----------
  const BOSSES = [
    { name: "もくもくおばけ", hp: 14, shot: "puff", cy: 140 },
    { name: "ゴロゴロかみなり", hp: 20, shot: "bolt", cy: 145 },
    { name: "ガラクタキング", hp: 30, shot: "gear", cy: 100 },
  ];

  // ---------- コース ----------
  const SEGS = [
    { name: "ほいくえん", sub: "みんなが まってるよ", scene: "town", len: 5000, speed: 440, icon: "🏠" },
    { name: "たいそう", sub: "さかあがり できるかな", scene: "park", len: 5000, speed: 450, icon: "🤸" },
    { boss: 0, scene: "sea", len: 3000, speed: 460, icon: "☁️" },
    { name: "いしだ", sub: "石田 ・ ちかてつの えき", scene: "city", len: 5000, speed: 470, icon: "🚇" },
    { boss: 1, scene: "storm", len: 3000, speed: 470, icon: "⚡" },
    { name: "ふじさん", sub: "にっぽんいち たかい やま", scene: "fuji", len: 5000, speed: 480, icon: "🗻" },
    { boss: 2, scene: "sunset", len: 3000, speed: 480, icon: "👾" },
    { name: "かえちゃん", sub: "ゴール！ おめでとう！", scene: "rainbow", len: 3600, speed: 500, icon: "👑", goal: true },
  ];
  const isBoss = (s) => s.boss !== undefined;
  const ENDS = [];
  SEGS.reduce((a, s) => { ENDS.push(a + s.len); return a + s.len; }, 0);
  const TOTAL = ENDS[ENDS.length - 1];
  const STAMP_SEGS = SEGS.filter((s) => !isBoss(s));
  const LAST_BOSS = BOSSES.length - 1;

  const SCN = {
    town:    { sky: ["#5fbfff", "#d4f0ff"], hill: "#8fd16a", hill2: "#b4e38c", ground: "#7cc65a", dirt: "#c99a63" },
    park:    { sky: ["#6fcaff", "#e4f8ff"], hill: "#5fb85a", hill2: "#93d77a", ground: "#6cc24a", dirt: "#b88b5a" },
    sea:     { sky: ["#4fb3f2", "#c8ecff"], hill: "#6fc3e8", hill2: "#9ad8f0", ground: "#f2d48f", dirt: "#e2b96a" },
    city:    { sky: ["#62bdf8", "#d9f1ff"], hill: "#a9c4dc", hill2: "#c8dbea", ground: "#7cc65a", dirt: "#c99a63" },
    storm:   { sky: ["#353a5e", "#8a90b0"], hill: "#4b5878", hill2: "#5f6b8c", ground: "#5f7f4f", dirt: "#5a4c40" },
    fuji:    { sky: ["#5d9cff", "#dce9ff"], hill: "#7fae6a", hill2: "#a8cf86", ground: "#79bb57", dirt: "#b88b5a" },
    sunset:  { sky: ["#6f58c4", "#ffb07a"], hill: "#7b5a9e", hill2: "#a7709a", ground: "#6f8f4f", dirt: "#8a6a4a" },
    rainbow: { sky: ["#8fd3ff", "#fff0f7"], hill: "#ffc4e1", hill2: "#c9f0c0", ground: "#9be07c", dirt: "#d8b07a" },
  };

  const INK = "#1d2b4f", BLUE = "#1f5fd1", ORANGE = "#ff8a1f", GOLD = "#ffd23f", CYAN = "#7ff3ff";
  const L = 236, BODY = 58, UNDER = 24;      // リニアの ながさ・たかさ・うきあがり
  const G = 1400, JUMP1 = 700, JUMP2 = 620, DEC = 300;
  const GAUGE_MAX = 8;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- がめん ----------
  let W = 0, H = 0, DPR = 1, S = 1, VW = 0, VH = 0, GY = 0, TX = 100;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    S = Math.min(H / 580, W / 650);
    VW = W / S; VH = H / S;
    GY = VH - Math.max(120, VH * 0.3);
    TX = Math.min(130, VW * 0.1 + 20);
  }
  addEventListener("resize", resize);
  resize();

  // ---------- おと ----------
  let AC = null, master = null, noiseBuf = null, muted = false, hum = null;
  function initAudio() {
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // リニアの ブーンという おと
      const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
      o.type = "sawtooth"; o.frequency.value = 60;
      f.type = "lowpass"; f.frequency.value = 200;
      g.gain.value = 0;
      o.connect(f); f.connect(g); g.connect(master); o.start();
      hum = { o, f, g };
    } catch (e) { AC = null; }
  }
  let humK = -1;
  function humSet(speed) {
    if (!hum) return;
    const k = muted ? 0 : Math.round(Math.min(1, speed / 500) * 50) / 50;
    if (k === humK) return;
    humK = k;
    const t = AC.currentTime;
    hum.g.gain.setTargetAtTime(0.06 * k, t, 0.12);
    hum.o.frequency.setTargetAtTime(55 + k * 85, t, 0.12);
    hum.f.frequency.setTargetAtTime(180 + k * 800, t, 0.12);
  }
  function tone(f, dur, o = {}) {
    if (!AC || muted) return;
    const t = AC.currentTime + (o.delay || 0);
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);

  // ---------- ものを おく ----------
  const SPECIALS = [

    { k: "taiko", name: "おおだいこ" },
  ];
  const OBST = { town: "cone", park: "rock", sea: "crab", city: "cone", storm: "rock", fuji: "rock", sunset: "rock" };
  const CAR_COLORS = ["#e8463a", "#1f5fd1", "#ffcc33", "#2fae5a"];
  const rnd = Math.random;
  function add(kind, x, y, extra) { objs.push(Object.assign({ kind, x, y, r: 16, done: false, ph: rnd() * 6 }, extra || {})); }
  function spawnChunk(x) {
    const seg = SEGS[segI];
    const end = segStart + seg.len;
    const zA = end + TX - 420, zB = end + VW + 300;
    if (x > zA && x < zB) return zB - x;
    if (seg.goal) {
      if (rnd() < 0.55) { for (let i = 0; i < 7; i++) add("star", x + i * 52, 46 + 170 * Math.sin(Math.PI * i / 6)); return 7 * 52 + 120; }
      const h = 40 + rnd() * 140;
      for (let i = 0; i < 6; i++) add("star", x + i * 54, h);
      return 6 * 54 + 120;
    }
    const lvl = Math.min(segI, 5), r = rnd();
    const pRock = 0.24 + lvl * 0.04;
    if (r < pRock) {
      add(OBST[seg.scene] || "rock", x + 90, 0, { w: 40, h: 42 });
      add("star", x + 10, 120); add("star", x + 90, 175); add("star", x + 170, 120);
      if (rnd() < 0.4) add("bigstar", x + 90, 300, { r: 22 });
      return 420 + rnd() * 200;
    }
    if (r < pRock + 0.14) {
      const sp = SPECIALS[Math.floor(rnd() * SPECIALS.length)];
      add(sp.k, x + 40, rnd() < 0.5 ? 160 : 60, { r: 24, name: sp.name, col: CAR_COLORS[Math.floor(rnd() * CAR_COLORS.length)] });
      return 320 + rnd() * 120;
    }
    if (r < pRock + 0.46) {
      for (let i = 0; i < 6; i++) add("star", x + i * 60, 46 + 150 * Math.sin(Math.PI * i / 5));
      return 6 * 60 + 200 + rnd() * 140;

  // ---------- つぶつぶ ----------
  function burst(x, y, n, colors, type) {
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, sp = 120 + rnd() * 320;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0, max: 0.7 + rnd() * 0.6,
        color: colors[i % colors.length], size: 4 + rnd() * 6, type: type || "dot", g: 500, rot: rnd() * 6 });
    }
  }
  function sparkTrail() {
    for (let i = 0; i < 10; i++) parts.push({ x: TX + 20 + rnd() * (L - 40), y: GY - 10, vx: -80 - rnd() * 120, vy: -10 - rnd() * 40, life: 0, max: 0.45, color: i % 2 ? CYAN : "#ffffff", size: 4 + rnd() * 4, type: "spark", g: 0 });
  }
  function pop(text, x, y, color, size) { pops.push({ text, x, y, t: 0, color: color || BLUE, size: size || 30 }); }

  // ---------- うごき ----------
  function update(dt) {
    time += dt;
    if (blend < 1) blend = Math.min(1, blend + dt / 2.2);
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.6);

    if (state === "run") {
      const seg = SEGS[segI];
      const end = segStart + seg.len;
      const target = seg.speed * (train.slowT > 0 ? 0.55 : 1);
      if (!braking) {
        v += Math.sign(target - v) * Math.min(Math.abs(target - v), 340 * dt);
        if (end - cam <= (v * v) / (2 * DEC) + 1) braking = true;
      }
      if (braking) {
        const rem = end - cam;
        v = Math.sqrt(Math.max(0, 2 * DEC * rem));
        if (rem < 1.5) arrive();
      }
      cam += v * dt;
      if (state === "run" && braking && cam >= end - 0.5) arrive();

      if (boss && isBoss(seg) && !boss.seen && bossX() < VW + 60) { boss.seen = true; SFX.oops(); }

      while (nextX < cam + VW + 300) nextX += spawnChunk(nextX);
    }
    humSet(state === "run" ? v : 0);
    for (const ln of lines) { ln.x -= (v * 2.2 + 40) * dt; if (ln.x < -ln.w) { ln.x = VW + rnd() * 300; ln.y = rnd(); } }

    // ジャンプ
    if (train.y > 0 || train.vy > 0) {
      train.vy -= G * dt;
      train.y += train.vy * dt;
      if (train.y <= 0) {
        train.y = 0; train.vy = 0; train.jumps = 0;
        if (train.spinning) { train.spinning = false; train.spin = 0; }
        sparkTrail();
      }
    }
    if (train.spinning) {
      train.spin += dt * Math.PI * 2 * 1.7;
      if (train.spin >= Math.PI * 2) { train.spin = 0; train.spinning = false; }
    }
    if (train.hitT > 0) train.hitT = Math.max(0, train.hitT - dt);
    if (train.slowT > 0) train.slowT = Math.max(0, train.slowT - dt);

    // もの
    const x1 = TX + 30, x2 = TX + L - 30, ty = train.y, tt = train.y + BODY + UNDER;
    for (const o of objs) {
      const sx = o.x - cam;
      if (o.fly) {
        o.fx += o.fvx * dt; o.fy += o.fvy * dt; o.fvy -= 900 * dt; o.rot += dt * 8;
        if (o.fy < -200) o.done = true;
        continue;
      }
      if (o.done || state !== "run") continue;
      if (o.kind === "cone" || o.kind === "rock" || o.kind === "crab") {
        if (sx + o.w / 2 > x1 && sx - o.w / 2 < x2 && ty < o.h - 6) {
          if (train.spinning) continue; // くるりん中は へっちゃら
          o.fly = true; o.fx = 0; o.fy = 0; o.fvx = 420; o.fvy = 520; o.rot = 0;
          train.hitT = 0.5; train.slowT = 1.0; shake = reduceMotion ? 0 : 0.25;
          SFX.hit();

        }
        continue;
      }
      const h = o.y + Math.sin(time * 3 + o.ph) * 5;
      if (sx + o.r > x1 - 8 && sx - o.r < x2 + 8 && h + o.r > ty - 8 && h - o.r < tt + 8) {

        const py = GY - h;

        else if (o.kind === "bigstar") { addStar(3); SFX.special(); burst(sx, py, 14, [GOLD, "#ffffff", "#ffb3d9"], "star"); pop("+3", sx, py - 20, "#e08a00"); }

          addStar(5); burst(sx, py, 16, [GOLD, "#ffffff", ORANGE], "star");
          if (o.kind === "taiko") { SFX.don(); pop("ドーン！ +5", sx, py - 26, "#e8463a", 32); }

    if (boss) {
      if (boss.shake > 0) boss.shake = Math.max(0, boss.shake - dt);
      if (boss.atkAnim > 0) boss.atkAnim = Math.max(0, boss.atkAnim - dt * 2.5);
      if (boss.defeated) boss.rise += dt;

      // かえちゃんの こうげき
      for (const s of shots) {

        s.y += (my - s.y) * Math.min(1, dt * 7);
        if (!s.hit && s.x > mx - 60) {
          s.hit = true;
          if (s.kind === "fist") robot.fistGone = false;
          damage(1, false);
        }

      shots = shots.filter((s) => !s.hit);
      if (!shots.some((s) => s.kind === "fist")) robot.fistGone = false;

      // ひっさつビーム
      if (robot.beamT > 0) {
        robot.beamT = Math.max(0, robot.beamT - dt);

        e.t += dt;
        e.x -= 320 * dt;
        e.y += (GY - ROBOT_LIFT - 170 - e.y) * Math.min(1, dt * 2);
        if (!e.hit && e.x < rx + 120) {
          e.hit = true;
          robot.shieldT = 0.4;
          SFX.shield();
          burst(rx + 120, e.y, 10, [CYAN, "#ffffff"], "spark");

  // ---------- え ----------
  function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);

    ctx.beginPath();

      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath();
  }

  function drawCloud(x, y, s, col) {
    ctx.fillStyle = col;
    circle(x, y, 26 * s); ctx.fill();
    circle(x + 28 * s, y - 12 * s, 30 * s); ctx.fill();
    circle(x + 58 * s, y, 24 * s); ctx.fill();
    rr(x - 10 * s, y - 4 * s, 80 * s, 26 * s, 13 * s); ctx.fill();
  }

  function drawRainbow(cx, cy, r, a) {
    const cols = ["#ff5b5b", "#ffa53b", "#ffe14a", "#6fd36b", "#4fb3ff", "#8b6cff"];
    ctx.save(); ctx.globalAlpha *= a; ctx.lineWidth = r * 0.06;
    cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r - i * r * 0.06, Math.PI, 0); ctx.stroke(); });
    ctx.restore();
  }

  function drawScene(name, a) {
    const s = SCN[name];
    ctx.save();
    ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, s.sky[0]); g.addColorStop(1, s.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, GY + 2);

    // おひさま
    if (name === "sunset") {
      ctx.fillStyle = "rgba(255,200,120,0.5)"; circle(VW * 0.72, GY - 170, 100); ctx.fill();
      ctx.fillStyle = "#ff9a3d"; circle(VW * 0.72, GY - 170, 70); ctx.fill();
    } else if (name !== "storm") {
      const sx = VW - 110, sy = 120;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(time * 0.3);
      ctx.strokeStyle = "rgba(255,214,80,0.8)"; ctx.lineWidth = 6; ctx.lineCap = "round";
      for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(52, 0); ctx.lineTo(66, 0); ctx.stroke(); }
      ctx.restore();
      ctx.fillStyle = "#ffd84a"; circle(sx, sy, 40); ctx.fill();
    }
    if (name === "rainbow") drawRainbow(VW * 0.5, GY - 40, Math.min(VW * 0.46, GY * 0.75), 0.8);

    // くも
    const co = cam * 0.08, cw = 380;
    const ccol = name === "sunset" ? "rgba(255,220,235,0.85)" : name === "storm" ? "rgba(70,76,110,0.95)" : "rgba(255,255,255,0.92)";
    for (let k = Math.floor(co / cw) - 1; k < (co + VW) / cw + 1; k++) {
      if (hash(k) < 0.25) continue;
      const cx = k * cw - co + hash(k + 9) * 140, cy = 70 + hash(k + 3) * Math.max(GY * 0.38, GY - 360);
      drawCloud(cx, cy, 0.8 + hash(k + 5) * 0.6, ccol);

    if (name === "fuji") {

      og.addColorStop(0, "#2b95dc"); og.addColorStop(1, "#86d6f7");
      ctx.fillStyle = og; ctx.fillRect(0, hz, VW, GY - hz);

      let bx = VW * 0.75 - (cam * 0.16) % P; if (bx < -100) bx += P;
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.moveTo(bx, hz + 22); ctx.lineTo(bx, hz - 30); ctx.lineTo(bx + 28, hz + 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#e8463a"; ctx.beginPath(); ctx.moveTo(bx - 26, hz + 20); ctx.lineTo(bx + 34, hz + 20); ctx.lineTo(bx + 24, hz + 32); ctx.lineTo(bx - 18, hz + 32); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 3; ctx.lineCap = "round";
      const wo = cam * 0.3, ww = 90;

          if (hash(k * 7 + row) < 0.45) continue;

        }

        ctx.save(); ctx.translate(fx + jt * 60, fy); ctx.rotate(-0.8 + jt * 1.6);

      }
    } else if (name === "city") {
      // とおくの ビル
      const off = cam * 0.15, tw = 70;

        const h = 60 + hash(k * 4.1) * 140, x = k * tw - off;
        ctx.fillStyle = hash(k * 2.2) > 0.5 ? s.hill : s.hill2;
        ctx.fillRect(x, GY - 20 - h, tw - 8, h + 20);

    } else {
      hills(0.15, GY - 70, 70, 30, s.hill2, 0.3);

    }

    drawMid(name);

    // あめ と かみなり
    if (name === "storm") {
      ctx.strokeStyle = "rgba(200,215,255,0.45)"; ctx.lineWidth = 2;
      for (let i = 0; i < 40; i++) {
        const x = (hash(i * 3.3) * VW + time * 300 + i * 37) % (VW + 40) - 20;
        const y = (hash(i * 7.7) * GY + time * 900) % GY;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 18); ctx.stroke();
      }

      if (ft < 0.12 || (ft > 0.22 && ft < 0.3)) { ctx.fillStyle = "rgba(255,255,230,0.35)"; ctx.fillRect(0, 0, VW, GY); }

      ctx.fillStyle = "#a6abb8"; ctx.fillRect(x - 14, GY + 20, 62, 12);
    }
    // ガイドウェイの ゆか（うしろ）
    ctx.fillStyle = "#8e94a3"; ctx.fillRect(0, GY - 4, VW, 8);
    ctx.restore();
  }

  // ガイドウェイの てまえの かべ（リニアの したを かくす）

        for (let r = 0; r < Math.floor((hh - 20) / 22); r++) {

          ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(x + 4, base - hh + 23 + r * 22, w - 14, 3);

          ctx.strokeStyle = "#c9d2dc"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, base - 58); ctx.lineTo(x + 70, base - 58); ctx.stroke();

        }

        ctx.fillStyle = "#8a5a3a"; ctx.fillRect(x + 36, base - r - 20, 10, r + 20);
        ctx.fillStyle = h3 > 0.5 ? "#3f9e45" : "#57b84f";
        circle(x + 41, base - r - 34, r); ctx.fill(); circle(x + 20, base - r - 20, r * 0.7); ctx.fill(); circle(x + 62, base - r - 20, r * 0.7); ctx.fill();

          ctx.fillStyle = "#e8463a"; ctx.fillRect(x, base - 90, 30, 18); ctx.fillRect(x, base - 40, 30, 18);
          ctx.fillStyle = "#ffe14a"; ctx.fillRect(x + 4, base - 136, 22, 16);
          ctx.fillStyle = "#e8463a"; ctx.beginPath(); ctx.moveTo(x - 4, base - 136); ctx.lineTo(x + 15, base - 152); ctx.lineTo(x + 34, base - 136); ctx.closePath(); ctx.fill();
          continue;
        }
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 30, base); ctx.lineTo(x + 30, base - 60); ctx.stroke();
        ctx.fillStyle = ["#ff6b6b", "#ffcc33", "#4fb3ff"][Math.floor(h2 * 3)];
        ctx.beginPath(); ctx.arc(x + 30, base - 58, 32, Math.PI, 0); ctx.closePath(); ctx.fill();
      } else if (name === "fuji") {
        ctx.fillStyle = "#3f8f45";

    } else if (e.kind === "bolt") {
      ctx.fillStyle = "#ffe14a";
      poly([[e.x + 18, e.y - 22], [e.x - 4, e.y + 2], [e.x + 6, e.y + 2], [e.x - 14, e.y + 24], [e.x + 14, e.y - 4], [e.x + 4, e.y - 4]], "#ffe14a");
    } else {
      ctx.translate(e.x, e.y); ctx.rotate(-e.t * 8);
      ctx.fillStyle = "#9aa3b5";
      ctx.beginPath();
      for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r = i % 2 ? 13 : 18; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      circle(0, 0, 5); ctx.fillStyle = "#3a4256"; ctx.fill();
    }
    ctx.restore();
  }
  function drawBigBeam() {
    if (robot.beamT <= 0) return;
    const rx = robotX(), y0 = GY - ROBOT_LIFT - 174, mx = boss ? bossX() : VW;
    if (robot.beamT > 1.35) {
      const k = (1.6 - robot.beamT) / 0.25;
      const g = ctx.createRadialGradient(rx, y0, 2, rx, y0, 20 + k * 50);
      g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(1, "rgba(127,243,255,0)");
      ctx.fillStyle = g; circle(rx, y0, 20 + k * 50); ctx.fill();
      return;
    }
    const wob = Math.sin(time * 60) * 4;
    ctx.save(); ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(110,240,255,0.45)"; ctx.lineWidth = 56 + wob; ctx.beginPath(); ctx.moveTo(rx, y0); ctx.lineTo(mx, y0 + 20); ctx.stroke();
    ctx.strokeStyle = CYAN; ctx.lineWidth = 30 + wob; ctx.beginPath(); ctx.moveTo(rx, y0); ctx.lineTo(mx, y0 + 20); ctx.stroke();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(rx, y0); ctx.lineTo(mx, y0 + 20); ctx.stroke();
    ctx.restore();
  }

  function drawFish(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = "#5b7fa8"; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-38, -12); ctx.lineTo(-38, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 28, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#dfe8f2"; ctx.beginPath(); ctx.ellipse(2, 5, 22, 6, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = "#2c4a6e"; ctx.lineWidth = 2;
    for (let i = -12; i < 12; i += 7) { ctx.beginPath(); ctx.moveTo(i, -11); ctx.lineTo(i + 5, -3); ctx.stroke(); }
    ctx.fillStyle = INK; circle(17, -3, 2.8); ctx.fill();
    ctx.restore();
  }
  function drawCar(x, y, col) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-30, 8); ctx.lineTo(-30, -4); ctx.quadraticCurveTo(-28, -8, -20, -8);
    ctx.lineTo(-12, -20); ctx.lineTo(12, -20); ctx.lineTo(22, -8); ctx.quadraticCurveTo(30, -7, 30, 0); ctx.lineTo(30, 8); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#cfeeff";
    polyPath([[-9, -17], [-1, -17], [-1, -8], [-16, -8]]); ctx.fill(); ctx.stroke();
    polyPath([[3, -17], [11, -17], [18, -8], [3, -8]]); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff59a"; circle(27, -1, 3); ctx.fill();
    for (const wx of [-17, 17]) { circle(wx, 9, 7); ctx.fillStyle = "#2b3245"; ctx.fill(); ctx.stroke(); circle(wx, 9, 2.5); ctx.fillStyle = "#c9d2dc"; ctx.fill(); }
    ctx.restore();
  }

  function drawObj(o) {
    let sx = o.x - cam, sy = GY - (o.kind === "cone" || o.kind === "rock" || o.kind === "crab" ? 0 : o.y + Math.sin(time * 3 + o.ph) * 5);
    if (sx < -80 || sx > VW + 80) return;
    ctx.save();
    if (o.fly) { sx += o.fx; sy -= o.fy; ctx.translate(sx, sy - 20); ctx.rotate(o.rot); ctx.translate(-sx, -(sy - 20)); }
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = "round";
    switch (o.kind) {
      case "star": case "bigstar": {
        const r = o.kind === "bigstar" ? 24 : 16;
        starPath(sx, sy, r, Math.sin(time * 2 + o.ph) * 0.25);
        ctx.fillStyle = o.kind === "bigstar" ? "#ffb3d9" : GOLD; ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.7)"; circle(sx - r * 0.2, sy - r * 0.25, r * 0.18); ctx.fill();
        break;
      }
      case "saba": drawFish(sx, sy, 1); break;
      case "car": drawCar(sx, sy, o.col); break;
      case "taiko": {
        ctx.fillStyle = "#b5532e"; rr(sx - 22, sy - 14, 44, 30, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#e8463a"; ctx.fillRect(sx - 20, sy - 2, 40, 6);
        ctx.fillStyle = "#fff3d6"; ctx.beginPath(); ctx.ellipse(sx, sy - 14, 22, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#7a4a2a"; ctx.lineWidth = 4; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(sx - 26, sy - 34); ctx.lineTo(sx - 8, sy - 18); ctx.moveTo(sx + 26, sy - 34); ctx.lineTo(sx + 8, sy - 18); ctx.stroke();
        break;
      }
      case "cone": {
        ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.moveTo(sx - 14, sy - 6); ctx.lineTo(sx, sy - 42); ctx.lineTo(sx + 14, sy - 6); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ffffff"; ctx.fillRect(sx - 8, sy - 26, 16, 6);
        ctx.fillStyle = ORANGE; rr(sx - 20, sy - 8, 40, 8, 3); ctx.fill(); ctx.stroke();
        break;
      }
      case "rock": {
        ctx.fillStyle = "#9a9aa8";
        ctx.beginPath(); ctx.moveTo(sx - 22, sy); ctx.lineTo(sx - 18, sy - 26); ctx.lineTo(sx - 4, sy - 40); ctx.lineTo(sx + 14, sy - 34); ctx.lineTo(sx + 22, sy - 12); ctx.lineTo(sx + 20, sy); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.moveTo(sx - 12, sy - 26); ctx.lineTo(sx - 3, sy - 34); ctx.lineTo(sx + 2, sy - 26); ctx.closePath(); ctx.fill();
        break;
      }
      case "crab": {
        ctx.fillStyle = "#ef5a3c";
        ctx.beginPath(); ctx.ellipse(sx, sy - 14, 20, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        circle(sx - 24, sy - 30, 8); ctx.fill(); ctx.stroke(); circle(sx + 24, sy - 30, 8); ctx.fill(); ctx.stroke();
        ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(sx - 6, sy - 26); ctx.lineTo(sx - 8, sy - 36); ctx.moveTo(sx + 6, sy - 26); ctx.lineTo(sx + 8, sy - 36); ctx.stroke();
        ctx.fillStyle = "#ffffff"; circle(sx - 8, sy - 38, 4); ctx.fill(); circle(sx + 8, sy - 38, 4); ctx.fill();
        ctx.fillStyle = INK; circle(sx - 8, sy - 38, 2); ctx.fill(); circle(sx + 8, sy - 38, 2); ctx.fill();
        break;
      }
    }
    ctx.restore();
  }

  function drawForeground() {
    const off = cam * 1.3, tw = 70;
    for (let k = Math.floor(off / tw) - 1; k < (off + VW) / tw + 1; k++) {
      const h = hash(k * 2.3 + 4);
      if (h < 0.35) continue;
      const x = k * tw - off + h * 30, y = GY + 60 + hash(k + 11) * Math.max(20, VH - GY - 90);
      if (h > 0.85) {
        ctx.fillStyle = ["#ff8fc7", "#ffffff", "#ffd84a"][k % 3];
        for (let i = 0; i < 5; i++) { circle(x + Math.cos(i * 1.256) * 5, y + Math.sin(i * 1.256) * 5, 4); ctx.fill(); }
        ctx.fillStyle = "#ffcc33"; circle(x, y, 3); ctx.fill();
      } else {
        ctx.strokeStyle = "rgba(40,110,40,0.6)"; ctx.lineWidth = 3; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 5, y - 12); ctx.moveTo(x + 4, y); ctx.lineTo(x + 5, y - 14); ctx.moveTo(x + 8, y); ctx.lineTo(x + 14, y - 10); ctx.stroke();
      }
    }
  }

  function draw() {
    ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
    ctx.clearRect(0, 0, VW, VH);
    ctx.save();
    if (shake > 0) ctx.translate((rnd() - 0.5) * 10 * shake * 4, (rnd() - 0.5) * 8 * shake * 4);

    if (prevScene && blend < 1) drawScene(prevScene, 1);
    drawScene(curScene, blend < 1 && prevScene ? blend : 1);

    // スピードの せん
    if (v > 250 && state === "run") {
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 3; ctx.lineCap = "round";
      for (const ln of lines) {
        const y = 90 + ln.y * Math.max(60, GY - 200);
        ctx.beginPath(); ctx.moveTo(ln.x, y); ctx.lineTo(ln.x + ln.w, y); ctx.stroke();
      }
    }

    if (boss && boss.defeated && isBoss(SEGS[segI])) drawRainbow(bossX(), GY - 20, Math.min(260, VW * 0.4), Math.min(1, boss.rise / 1.2));

    drawStation(0, "しゅっぱつ", false);
    SEGS.forEach((s, i) => { if (!isBoss(s)) drawStation(ENDS[i], s.name, !!s.goal); });

    for (const o of objs) drawObj(o);

    drawBoss();

    // リニア / ロボ
    const by = GY - UNDER - train.y;
    if (train.y > 0) {
      ctx.fillStyle = "rgba(29,43,79,0.18)";
      const k = Math.max(0.3, 1 - train.y / 400);
      ctx.beginPath(); ctx.ellipse(TX + L / 2, GY - 6, L * 0.45 * k, 6 * k, 0, 0, Math.PI * 2); ctx.fill();
    }
    const wob = train.hitT > 0 ? Math.sin(train.hitT * 40) * 0.06 : 0;
    const idle = Math.sin(time * 3) * 1.5;
    const rx = robotX(), rgy = GY - ROBOT_LIFT;
    const easeBack = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
    const robotFront = robot.mode !== "train";
    if (robotFront) drawGuidewayFront(curScene);
    if (robot.mode === "train") drawTrain(TX, by + (train.y > 0 ? 0 : idle), train.spin + wob);
    else if (robot.mode === "robot") drawRobot(rx, rgy, 1, robot.punch, robot.fistGone, robot.shieldT);
    else {
      let p = Math.min(1, robot.t / 0.9);
      if (robot.mode === "untransforming") p = 1 - p;
      if (p < 0.5) { ctx.save(); ctx.globalAlpha = 1 - p; drawTrain(TX, by, Math.sin(time * 40) * 0.03 * p * 2); ctx.restore(); }
      else drawRobot(rx, rgy, Math.max(0.2, easeBack((p - 0.5) / 0.5)), 0, false, 0);
      const gl = ctx.createRadialGradient(TX + L / 2, GY - 100, 10, TX + L / 2, GY - 100, 200);
      gl.addColorStop(0, `rgba(255,255,255,${0.9 * (1 - Math.abs(p - 0.5) * 2)})`); gl.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gl; ctx.fillRect(TX - 100, GY - 320, L + 200, 340);
    }
    if (!robotFront) drawGuidewayFront(curScene);

    for (const s of shots) drawShot(s);
    for (const e of eshots) drawEnemyShot(e);
    drawBigBeam();

    drawForeground();

    for (const p of parts) {
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.color;
      if (p.type === "star") { starPath(p.x, p.y, p.size * 1.4, p.rot + p.life * 6); ctx.fill(); }
      else if (p.type === "spark") { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); }
      else if (p.type === "puff") { circle(p.x, p.y, p.size * (1 + p.life * 1.5)); ctx.fill(); }
      else { circle(p.x, p.y, p.size * 0.6); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const p of pops) {
      const a = p.t < 0.7 ? 1 : 1 - (p.t - 0.7) / 0.3;
      const sc = p.t < 0.15 ? 0.6 + p.t / 0.15 * 0.4 : 1;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = `${Math.round(p.size * sc)}px "Mochiy Pop One", sans-serif`;
      ctx.lineWidth = 7; ctx.strokeStyle = "#ffffff"; ctx.lineJoin = "round";
      ctx.strokeText(p.text, p.x, p.y - p.t * 60);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - p.t * 60);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, flash)})`; ctx.fillRect(0, 0, VW, VH); }
  }

  // ---------- ループ ----------
  resetGame();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    if (state !== "title" && state !== "end") updateTrack();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
