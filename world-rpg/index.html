<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>テラルート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* 全画面の3D。四隅に小さなHUD、下の左右に操作。旅券とガラスを思わせる、塩湖の夜明け色で一色固定 */
  :root {
    --ink: #0e1424;
    --glass: rgba(14, 20, 36, 0.62);
    --glass2: rgba(14, 20, 36, 0.86);
    --paper: #f4f7fb;
    --mute: #a9b6cc;
    --line: rgba(244, 247, 251, 0.2);
    --dawn: #ffb98a;
    --gold: #ffe08a;
    --hp: #ff6b7d;
    --mp: #6fc3ff;
    --ok: #8fe3b0;
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 14px;
    overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--dawn); outline-offset: 2px; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; }
  #touch { position: absolute; inset: 0; touch-action: none; }

  .safe-t { top: calc(8px + env(safe-area-inset-top, 0px)); }
  .hud { position: absolute; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  #stat { left: calc(10px + env(safe-area-inset-left, 0px)); width: min(42vw, 210px); display: grid; gap: 4px; }
  #stat .who { display: flex; gap: 8px; align-items: baseline; font-weight: 700; text-shadow: 0 1px 4px #000a; }
  #stat .who small { color: var(--gold); font-weight: 700; }
  .bar { height: 9px; border-radius: 5px; background: rgba(0,0,0,.45); overflow: hidden; border: 1px solid var(--line); }
  .bar > i { display: block; height: 100%; width: 100%; transform-origin: left; border-radius: 4px; transition: transform .15s; }
  #hpb > i { background: linear-gradient(90deg, #ff8a70, var(--hp)); }
  #mpb > i { background: linear-gradient(90deg, #7fe0ff, var(--mp)); }
  #mpb, #xpb { height: 5px; } #xpb > i { background: var(--gold); }
  #stat .nums { font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }

  #topr { right: calc(10px + env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 6px; }
  #clock { background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-variant-numeric: tabular-nums; font-size: 12px; display: flex; gap: 8px; }
  #clock b { color: var(--gold); font-weight: 700; }
  #mapwrap { display: flex; gap: 6px; align-items: flex-start; }
  #map { width: 84px; height: 84px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); }
  .ibtn { height: 34px; padding: 0 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; }

  #goal { left: 50%; transform: translateX(-50%); max-width: min(46vw, 420px); text-align: center; font-size: 12px; line-height: 1.4;
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; pointer-events: none; }
  #goal span { color: var(--dawn); font-weight: 700; margin-right: 6px; }
  #bossbar { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(34vw, 380px); text-align: center; pointer-events: none; }
  #bossbar div.n { font-family: var(--display); font-size: 15px; letter-spacing: .12em; text-shadow: 0 1px 6px #000; margin-bottom: 3px; }
  #bossbar .bar > i { background: linear-gradient(90deg, #bfe9ff, #7aa8ff); }

  #banner { left: 0; right: 0; top: 36%; text-align: center; font-family: var(--display); font-size: clamp(22px, 5vw, 38px); letter-spacing: .3em;
    text-shadow: 0 2px 18px #000c; opacity: 0; transition: opacity .8s; pointer-events: none; }
  #banner small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: .4em; color: var(--dawn); margin-top: 6px; }
  #banner.on { opacity: 1; }
  #toasts { left: 50%; transform: translateX(-50%); top: calc(46px + env(safe-area-inset-top, 0px)); display: grid; gap: 5px; justify-items: center; pointer-events: none; width: min(88vw, 460px); }
  .toast { background: var(--glass2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; font-size: 12px; line-height: 1.5; animation: tin .25s ease-out; text-align: center; }
  .toast b { color: var(--gold); }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
  .dmg { position: absolute; font-weight: 700; font-size: 18px; text-shadow: 0 1px 0 #000, 0 0 6px #000; pointer-events: none; animation: dm .8s ease-out forwards; font-variant-numeric: tabular-nums; }
  .dmg.crit { color: var(--gold); font-size: 24px; } .dmg.me { color: var(--hp); } .dmg.heal { color: var(--ok); }
  @keyframes dm { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -46px); } }

  #joy { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.07); pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #joyhint { left: calc(26px + env(safe-area-inset-left, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 96px; border-radius: 50%; border: 1px dashed var(--line);
    display: grid; place-items: center; color: var(--mute); font-size: 11px; pointer-events: none; }
  #pad { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 216px; height: 196px; }
  .ab { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); font-size: 11px; font-weight: 700; line-height: 1.15;
    display: grid; place-items: center; text-align: center; }
  .ab:active, .ab.on { background: rgba(255, 185, 138, .4); }
  .ab.dis { opacity: .35; }
  .ab small { display: block; font-size: 10px; color: var(--gold); font-variant-numeric: tabular-nums; }
  #bAtk { width: 86px; height: 86px; right: 0; bottom: 0; font-size: 15px; background: rgba(255, 185, 138, .28); border-color: rgba(255, 185, 138, .7); }
  #bDodge { right: 96px; bottom: 0; } #bJump { right: 84px; bottom: 66px; } #bSkill { right: 20px; bottom: 98px; }
  #bFly { right: 152px; bottom: 44px; } #bPot { right: 148px; bottom: 110px; }
  #bTalk { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); padding: 10px 22px; border-radius: 999px;
    background: var(--dawn); color: #2a1608; font-weight: 700; box-shadow: 0 4px 18px #0008; }
  #photoBar { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: center; pointer-events: none; }
  #photoBar button { pointer-events: auto; padding: 8px 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); }
  #combo { right: calc(20px + env(safe-area-inset-right, 0px)); top: 40%; font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--gold); text-shadow: 0 2px 10px #000, 0 0 18px rgba(255,190,90,.6); opacity: 0; pointer-events: none; }
  #combo.on { animation: cb 2.6s ease-out forwards; }
  @keyframes cb { 0% { opacity: 1; transform: scale(1.5); } 12% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  .ibtn.dot { position: relative; } .ibtn.dot::after { content: ""; position: absolute; right: -2px; top: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--hp); border: 2px solid var(--ink); }
  #map { cursor: pointer; }
  #codeT { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--paper); font: 12px/1.5 ui-monospace, monospace; word-break: break-all; -webkit-user-select: text; user-select: text; resize: vertical; }

  .screen { position: absolute; inset: 0; display: grid; }
  #title { place-items: center; text-align: center; background: linear-gradient(180deg, rgba(14,20,36,.15), rgba(14,20,36,.0) 40%, rgba(14,20,36,.55));
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  #title h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 92px); letter-spacing: .14em; margin: 0; text-shadow: 0 4px 30px #0009; line-height: 1.05; }
  #title p { margin: 10px 0 0; letter-spacing: .5em; font-size: 12px; color: var(--paper); text-shadow: 0 1px 8px #000; }
  #title .chap { margin-top: 6px; color: var(--dawn); letter-spacing: .3em; }
  .cta { display: grid; gap: 10px; justify-items: center; margin-top: 28px; }
  .btn { min-width: 200px; padding: 12px 26px; border-radius: 999px; background: var(--paper); color: var(--ink); font-weight: 700; letter-spacing: .1em; box-shadow: 0 6px 24px #0007; }
  .btn.ghost { background: var(--glass); color: var(--paper); border: 1px solid var(--line); }
  .btn.sm { min-width: 0; padding: 8px 14px; font-size: 13px; letter-spacing: 0; box-shadow: none; }
  .btn:disabled { opacity: .4; }

  #create { align-items: end; pointer-events: none; }
  #cpanel { pointer-events: auto; background: var(--glass2); border-top: 1px solid var(--line); backdrop-filter: blur(8px);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    max-height: 52%; overflow-y: auto; display: grid; gap: 8px; }
  @media (orientation: landscape) and (min-width: 640px) {
    #create { align-items: stretch; justify-items: end; }
    #cpanel { width: min(46%, 430px); max-height: none; border-top: 0; border-left: 1px solid var(--line); align-content: start; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  }
  #cpanel h2 { font-family: var(--display); font-size: 18px; margin: 0; letter-spacing: .2em; }
  .row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; }
  .row > label, .row > span { color: var(--mute); font-size: 12px; }
  .opts { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px #0006; }
  .chip { padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid var(--line); font-size: 12px; }
  .sw.sel { border-color: var(--paper); } .chip.sel { background: var(--paper); color: var(--ink); }
  #nm { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--paper); font: inherit; -webkit-user-select: text; user-select: text; }
  .rowbtn { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 2px; }

  .modal { position: absolute; inset: 0; background: rgba(6, 9, 18, .55); display: grid; place-items: center;
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .card { width: min(100%, 460px); max-height: 100%; overflow-y: auto; background: var(--glass2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; backdrop-filter: blur(8px); }
  .card h2 { font-family: var(--display); margin: 0; font-size: 18px; letter-spacing: .15em; display: flex; justify-content: space-between; align-items: center; }
  .card p { margin: 0; line-height: 1.6; color: var(--paper); }
  .tabs { display: flex; gap: 6px; }
  .list { display: grid; gap: 6px; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.06); }
  .item div { min-width: 0; } .item small { display: block; color: var(--mute); font-size: 11px; line-height: 1.4; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-variant-numeric: tabular-nums; }
  .kv dt { color: var(--mute); } .kv dd { margin: 0; }
  .got { color: var(--gold); } .none { color: var(--mute); }
  @media (orientation: portrait) {
    #goal { left: calc(10px + env(safe-area-inset-left, 0px)); transform: none; text-align: left; top: calc(78px + env(safe-area-inset-top, 0px)); max-width: calc(100vw - 150px); }
    #toasts { top: calc(146px + env(safe-area-inset-top, 0px)); }
    #bossbar { bottom: calc(226px + env(safe-area-inset-bottom, 0px)); width: min(80vw, 380px); }
  }
  #fade { position: absolute; inset: 0; background: #05070e; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #fade.on { opacity: 1; }
  #err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--ink); line-height: 1.7; }
  @media (prefers-reduced-motion: reduce) { .toast, .dmg { animation-duration: .01s; } #banner, #fade { transition: none; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="touch"></div>

  <div id="hud" hidden>
    <div id="stat" class="hud safe-t">
      <div class="who"><span id="hName">旅人</span><small id="hLv">Lv 1</small></div>
      <div class="bar" id="hpb"><i></i></div>
      <div class="bar" id="mpb"><i></i></div>
      <div class="bar" id="xpb"><i></i></div>
      <div class="nums" id="hNums"></div>
    </div>
    <div id="goal" class="hud safe-t"><span>目的</span><em id="goalT" style="font-style:normal"></em></div>
    <div id="bossbar" class="hud" hidden><div class="n">塩晶の巨人 サラール</div><div class="bar"><i id="bossI"></i></div></div>
    <div id="topr" class="hud safe-t">
      <div id="clock"><span id="ckT">06:30</span><b id="ckP">朝</b><span id="ckG">0 G</span></div>
      <div id="mapwrap"><button class="ibtn" id="bMenu" type="button">手帳</button><canvas id="map" width="168" height="168"></canvas></div>
    </div>
    <div id="joyhint" class="hud">移動</div>
    <div id="joy" hidden><i></i></div>
    <div id="pad" class="hud">
      <button class="ab" id="bPot" type="button">回復<small id="potN">3</small></button>
      <button class="ab" id="bFly" type="button">飛ぶ</button>
      <button class="ab" id="bSkill" type="button">回転<br>斬り</button>
      <button class="ab" id="bJump" type="button">ジャンプ</button>
      <button class="ab" id="bDodge" type="button">回避</button>
      <button class="ab" id="bAtk" type="button">攻撃</button>
    </div>
    <button id="bTalk" type="button" hidden>話す</button>
  </div>
  <div id="photoBar" hidden><button id="bPose" type="button">ポーズ：なし</button><button id="bBack" type="button">写真モードを終える</button></div>
  <div id="combo" class="hud"></div>
  <div id="banner" class="hud"></div>
  <div id="toasts" class="hud"></div>
  <div id="dmgs"></div>

  <div id="title" class="screen">
    <div>
      <h1>TERRA<br>ROUTE</h1>
      <p>世界をめぐる冒険</p>
      <p class="chap">第一章　ウユニ塩湖</p>
      <div class="cta">
        <button class="btn" id="bCont" type="button" hidden>つづきから</button>
        <button class="btn" id="bNew" type="button">あたらしく旅に出る</button>
        <button class="btn ghost sm" id="bCode" type="button">セーブコードで再開</button>
        <p id="tnote" style="letter-spacing:0;max-width:30em"></p>
      </div>
    </div>
  </div>

  <div id="create" class="screen" hidden>
    <div id="cpanel">
      <h2>旅人をつくる</h2>
      <div class="row"><label for="nm">名前</label><input id="nm" maxlength="8" placeholder="旅人" autocomplete="off"></div>
      <div id="crows"></div>
      <div class="rowbtn"><button class="btn ghost sm" id="bRand" type="button">おまかせ</button><button class="btn sm" id="bGo" type="button">この姿で旅に出る</button></div>
    </div>
  </div>

  <div id="menu" class="modal" hidden><div class="card">
    <h2>旅の手帳<button class="btn ghost sm" data-close type="button">とじる</button></h2>
    <div class="tabs"><button class="chip sel" data-tab="st" type="button">ステータス</button><button class="chip" data-tab="q" type="button">依頼</button><button class="chip" data-tab="bag" type="button">もちもの</button><button class="chip" data-tab="alb" type="button">アルバム</button><button class="chip" data-tab="set" type="button">設定</button></div>
    <div id="menuBody"></div>
  </div></div>

  <div id="shop" class="modal" hidden><div class="card">
    <h2>塩のホテルの売店<button class="btn ghost sm" data-close type="button">とじる</button></h2>
    <p id="shopSay"></p>
    <div class="list" id="shopBody"></div>
  </div></div>

  <div id="mapm" class="modal" hidden><div class="card">
    <h2>地図<button class="btn ghost sm" data-close type="button">とじる</button></h2>
    <canvas id="bigmap" width="600" height="600" style="width:min(100%,300px);aspect-ratio:1;justify-self:center"></canvas>
    <div class="list" id="warpList"></div>
  </div></div>

  <div id="codem" class="modal" hidden><div class="card">
    <h2>セーブコード<button class="btn ghost sm" id="codeClose" type="button">とじる</button></h2>
    <p id="codeMsg"></p>
    <textarea id="codeT" rows="5" spellcheck="false" autocomplete="off"></textarea>
    <div class="rowbtn"><button class="btn ghost sm" id="codeCopy" type="button">コピー</button><button class="btn sm" id="codeLoad" type="button">このコードで再開</button></div>
  </div></div>

  <div id="fade"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { const d = document.createElement('div'); d.id = 'err'; d.textContent = '3Dの部品を読み込めませんでした。通信を確かめて、もう一度開いてください。'; $('game').appendChild(d); return; }
const T = THREE, PI = Math.PI, rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- 保存 ---------- */
const KEY = 'terra-route-v1';
const LOOK0 = { skin: 1, hair: 2, bang: 0, hairC: 0, eye: 0, outfit: 0, outC: 0, accC: 0, sil: 0, build: 1, height: 1 };
function freshState() { return { name: '旅人', look: Object.assign({}, LOOK0), lv: 1, exp: 0, hp: 102, mp: 32, gold: 0, potions: 3, items: { salt: 0, flower: 0, gear: 0, star: 0 },
  wpn: 0, arm: 0, souv: {}, feather: false, boss: false, time: 6.4, pos: [0, 0, 16], quality: 'mid', mute: false, created: false, kills: {}, qdone: {}, seen: {}, chests: {}, pet: false, autoPot: false, saved: 0 }; }
let S = freshState();
function applySave(j) { S = Object.assign(freshState(), j); S.look = Object.assign({}, LOOK0, j.look); S.items = Object.assign({ salt: 0, flower: 0, gear: 0, star: 0 }, j.items); ['souv', 'kills', 'qdone', 'seen', 'chests'].forEach(k => { S[k] = Object.assign({}, j[k]); }); }
let storeOK = true; try { localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t'); } catch (e) { storeOK = false; }
function load() { try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.created) { applySave(j); return true; } } catch (e) {} return false; }
function save(manual) { if (!S.created) return false; try { S.pos = [P.x, 0, P.z]; S.saved = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); if (manual) toast('セーブした'); return true; }
  catch (e) { if (manual) toast('この開き方では端末に保存できない。「セーブコード」で控えを取ってほしい', 6000); return false; } }
function saveCode() { S.pos = [P.x, 0, P.z]; return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function loadCode(c) { try { const j = JSON.parse(decodeURIComponent(escape(atob(String(c).replace(/\s+/g, ''))))); if (j && j.created && j.look) { applySave(j); return true; } } catch (e) {} return false; }
let hasSave = load();

/* ---------- 描画の土台 ---------- */
const canvas = $('c');
let renderer;
try { renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { const d = document.createElement('div'); d.id = 'err'; d.textContent = 'この端末のブラウザでは3D表示（WebGL）が使えませんでした。'; $('game').appendChild(d); return; }

  if (shoot.visible) { shootT += dt; const p = starG.attributes.position.array, hx = camera.position.x + shootA.x + shootV.x * shootT, hy = camera.position.y + shootA.y + shootV.y * shootT, hz = camera.position.z + shootA.z + shootV.z * shootT;
    p[0] = hx; p[1] = hy; p[2] = hz; p[3] = hx - shootV.x * 0.16; p[4] = hy - shootV.y * 0.16; p[5] = hz - shootV.z * 0.16; starG.attributes.position.needsUpdate = true; if (shootT > 0.7) shoot.visible = false; }
  for (let i = 0; i < rings.length; i++) { const r = rings[i]; if (!r.m.visible) continue; r.t += dt; const k = r.t / 0.4; r.m.scale.setScalar(r.s * (0.3 + k)); r.m.material.opacity = Math.max(0, 0.9 * (1 - k)); if (k >= 1) r.m.visible = false; }

/* ---------- 宝箱 ---------- */
const CHESTS = [[-70, 60], [100, -60], [-170, 40], [205, 95], [62, -246], [-60, 180], [120, 180], [-30, -110], [-230, -120], [240, -40]], chestObjs = [];

function rebuildChests() { chestObjs.forEach(c => scene.remove(c.g)); chestObjs.length = 0; CHESTS.forEach((p, i) => { if (S.chests[i]) return; const g = new T.Group(); g.position.set(p[0], heightAt(p[0], p[1]), p[1]); g.rotation.y = i * 1.3; mesh(chestGeo, chestMat, g); glow(0xffd070, 2.4, g, 0.55).position.y = 0.9; scene.add(g); chestObjs.push({ g, i }); }); }
function updateChests() { for (let k = chestObjs.length - 1; k >= 0; k--) { const c = chestObjs[k]; if (Math.hypot(P.x - c.g.position.x, P.z - c.g.position.z) < 1.5 && P.y - c.g.position.y < 2) { S.chests[c.i] = 1; scene.remove(c.g); chestObjs.splice(k, 1);
  let msg; if (c.i % 3 === 2) { S.potions += 2; msg = '回復薬×2'; } else { const g = 40 + c.i * 12; S.gold += g; msg = g + 'G'; } toast('宝箱をあけた　<b>' + msg + '</b>'); sfx('get'); burst(P.x, P.y + 1, P.z, 0xffe08a, 14, 5); spawnRing(c.g.position.x, c.g.position.y + 0.1, c.g.position.z, 0xffd070, 3); questCheck(); save(); } } }

/* ---------- 依頼 ---------- */
const QUESTS = [{ id: 'q1', t: 'ソルトゼリーを5体倒す', k: 'jelly', n: 5, g: 60, pet: 1 }, { id: 'q2', t: 'カクタンを5体倒す', k: 'cactus', n: 5, g: 140, pot: 1 }, { id: 'q3', t: 'サビゴーレムを4体倒す', k: 'golem', n: 4, g: 240, pot: 2 },
  { id: 'q4', t: '夜のホシクラゲを5体倒す', k: 'star', n: 5, g: 320, pot: 2 }, { id: 'q5', t: '宝箱を6個あける', k: 'chest', n: 6, g: 200 }, { id: 'q6', t: 'おみやげを5つ集める', k: 'souv', n: 5, g: 260 }, { id: 'q7', t: '塩晶の巨人を倒す', k: 'boss', n: 1, g: 500, pot: 3 }];
const qNote = {};
function qProg(q) { return q.k === 'chest' ? Object.keys(S.chests).length : q.k === 'souv' ? Object.keys(S.souv).length : (S.kills[q.k] || 0); }
function questCheck() { let any = false; QUESTS.forEach(q => { if (S.qdone[q.id] || qProg(q) < q.n) return; any = true; if (!qNote[q.id]) { qNote[q.id] = 1; toast('依頼達成：<b>' + q.t + '</b>　手帳の「依頼」で受け取れる', 5000); } }); $('bMenu').classList.toggle('dot', any); }
function questReward(q) { let r = q.g + 'G'; if (q.pot) r += '・回復薬×' + q.pot; if (q.pet) r += '・アルパカの子が仲間に'; return r; }

/* ---------- 相棒のアルパカ ---------- */
let pet = null;
function syncPet() { if (!S.pet) { if (pet) { scene.remove(pet.g); pet = null; } return; } if (pet) return; const g = new T.Group(), w = 0xfff4e6, m = vmat({ roughness: 1 });
  mesh(merge([part(sph(0.34, 14, 10), { p: [0, 0.74, 0], s: [0.85, 0.8, 1.25], c: w }), part(cyl(0.11, 0.15, 0.52, 10), { p: [0, 1.1, 0.36], r: [0.25, 0, 0], c: w }), part(sph(0.15, 12, 8), { p: [0, 1.4, 0.44], s: [0.9, 0.95, 1.1], c: w }), part(sph(0.085, 10, 6), { p: [0, 1.35, 0.57], s: [1, 0.8, 1], c: 0xf0d8c0 }),
    part(sph(0.13, 10, 6), { p: [0, 1.52, 0.4], c: w }), part(cone(0.04, 0.14, 6), { p: [0.09, 1.57, 0.4], r: [0, 0, -0.3], c: w }), part(cone(0.04, 0.14, 6), { p: [-0.09, 1.57, 0.4], r: [0, 0, 0.3], c: w }), part(sph(0.1, 8, 6), { p: [0, 0.84, -0.44], c: w }),
    part(sph(0.024), { p: [0.075, 1.42, 0.555], c: 0x15100e }), part(sph(0.024), { p: [-0.075, 1.42, 0.555], c: 0x15100e }), part(sph(0.02), { p: [0, 1.35, 0.655], c: 0x4a3526 }), part(new T.TorusGeometry(0.135, 0.035, 6, 14), { p: [0, 1.0, 0.33], r: [PI / 2 - 0.25, 0, 0], c: 0xd8354a }), part(sph(0.05), { p: [0, 0.93, 0.47], c: 0xf0c040 })]), m, g);
  const lg = cyl(0.055, 0.045, 0.52, 8); lg.translate(0, -0.26, 0); const legs = [[0.14, 0.26], [-0.14, 0.26], [0.14, -0.26], [-0.14, -0.26]].map(p => { const l = mesh(part(lg, { c: w }), m, g); l.position.set(p[0], 0.54, p[1]); return l; });
  g.position.set(P.x - 2, 0, P.z - 2); scene.add(g); pet = { g, legs, x: P.x - 2, z: P.z - 2, face: 0, walk: 0, find: 40, pat: 0 }; }
function updatePet(dt) { if (!pet) return; const tx = P.x - Math.sin(P.face) * 2.2 + Math.cos(P.face) * 1.2, tz = P.z - Math.cos(P.face) * 2.2 - Math.sin(P.face) * 1.2; let dx = tx - pet.x, dz = tz - pet.z; const d = Math.hypot(dx, dz);
  if (d > 60) { pet.x = tx; pet.z = tz; } else if (d > 0.8) { const sp = Math.min(13, 2 + d * 2.2); pet.x += dx / d * sp * dt; pet.z += dz / d * sp * dt; pet.face = Math.atan2(dx, dz); pet.walk += dt * sp * 2.2; } else { pet.face = Math.atan2(P.x - pet.x, P.z - pet.z); }
  const s = d > 0.8 ? Math.sin(pet.walk) * 0.6 : 0; pet.legs[0].rotation.x = s; pet.legs[3].rotation.x = s; pet.legs[1].rotation.x = -s; pet.legs[2].rotation.x = -s;
  pet.pat -= dt; const hop = pet.pat > 0 ? Math.abs(Math.sin(pet.pat * 12)) * 0.25 : 0; pet.g.position.set(pet.x, heightAt(pet.x, pet.z) + hop, pet.z); let dr = pet.face - pet.g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); pet.g.rotation.y += dr * Math.min(1, dt * 8);
  pet.find -= dt; if (pet.find <= 0) { pet.find = rnd(45, 75); if (Math.random() < 0.2) { S.potions++; toast('アルパカの子が <b>回復薬</b> を見つけてきた'); } else { const g = Math.round(rnd(8, 20) + S.lv * 2); S.gold += g; toast('アルパカの子が <b>' + g + 'G</b> を見つけてきた'); } sfx('get'); } }
function petPat() { if (!pet || pet.pat > -3) return; pet.pat = 0.8; burst(pet.x, pet.g.position.y + 1.7, pet.z, 0xff8aa8, 8, 2); const h = Math.round(maxHP() * 0.15); S.hp = Math.min(maxHP(), S.hp + h); dmgText(P.x, P.y + 2, P.z, '+' + h, 'heal'); toast('アルパカの子がうれしそうにしている'); sfx('get'); }

/* ---------- 地図とワープ ---------- */
function drawMap(c, R, big) { const k = R / (WORLD_R + 20), f = R / 84; c.clearRect(0, 0, R * 2, R * 2); c.save(); c.translate(R, R);
  const dot = (x, z, col, r) => { c.fillStyle = col; c.beginPath(); c.arc(x * k, z * k, r * f, 0, 7); c.fill(); };
  if (big) { c.fillStyle = 'rgba(14,20,36,.7)'; c.beginPath(); c.arc(0, 0, R - 2, 0, 7); c.fill(); }
  dot(LAKE.x, LAKE.z, 'rgba(255,143,166,.5)', 9); dot(ISLAND.x, ISLAND.z, '#6fae62', 10); dot(TRAIN.x, TRAIN.z, '#b0683a', 6); dot(0, -4, '#ffffff', 6);
  c.strokeStyle = S.boss ? '#9fd0ff' : '#ff7a6a'; c.lineWidth = 3 * f; c.beginPath(); c.arc(ARENA.x * k, ARENA.z * k, 7 * f, 0, 7); c.stroke();
  pickups.forEach(p => dot(p.s.x, p.s.z, '#ffe08a', 3.5)); if (big) chestObjs.forEach(o => dot(o.g.position.x, o.g.position.z, '#f0a030', 2.2));
  enemies.forEach(e => { if (!e.dead && e.type !== 'boss') dot(e.x, e.z, 'rgba(255,107,125,.8)', 2); });
  if (big) { c.fillStyle = '#f4f7fb'; c.font = '700 ' + (11 * f / 3.2 + 9) + 'px sans-serif'; c.textAlign = 'center'; PLACES.forEach((p, i) => { if (i === 0 || S.seen[i]) c.fillText(p.n, p.x * k, p.z * k - 14 * f); }); }
  c.save(); c.translate(P.x * k, P.z * k); c.rotate(-P.face + PI); c.fillStyle = '#fff'; c.strokeStyle = '#0e1424'; c.lineWidth = 2; const a = big ? 1.6 : 1; c.beginPath(); c.moveTo(0, -9 * a); c.lineTo(6 * a, 7 * a); c.lineTo(0, 3 * a); c.lineTo(-6 * a, 7 * a); c.closePath(); c.stroke(); c.fill(); c.restore(); c.restore();
  c.fillStyle = '#a9b6cc'; c.font = '700 ' + (big ? 22 : 16) + 'px sans-serif'; c.textAlign = 'center'; c.fillText('N', R, big ? 26 : 18); }
function openMap() { drawMap($('bigmap').getContext('2d'), 300, true); const fight = boss && !boss.dead && boss.state !== 'idle';
  $('warpList').innerHTML = PLACES.map((p, i) => '<div class="item"><div>' + (i === 0 || S.seen[i] ? p.n : '？？？') + '<small>' + (i === 0 || S.seen[i] ? p.s : 'まだ行っていない場所') + '</small></div><button class="btn sm" data-warp="' + i + '" type="button"' + ((i === 0 || S.seen[i]) && !fight ? '' : ' disabled') + '>ワープ</button></div>').join('');
  $('warpList').querySelectorAll('[data-warp]').forEach(b => b.addEventListener('click', () => { const p = PLACES[+b.dataset.warp]; $('fade').classList.add('on'); setTimeout(() => { P.x = p.w[0]; P.z = p.w[1]; P.y = heightAt(P.x, P.z); P.fly = false; P.on = true; P.vy = 0; if (pet) { pet.x = P.x - 2; pet.z = P.z - 2; } syncButtons(); closeModals(); $('fade').classList.remove('on'); sfx('fly'); }, 450); }));
  openModal('mapm'); }
$('map').addEventListener('click', openMap);

/* ---------- セーブコード ---------- */
function openCode(fromTitle) { $('codeT').value = S.created ? saveCode() : ''; $('codeMsg').textContent = S.created ? '下の文字がいまの旅の控え。コピーして、メモなどに貼っておける。' : '控えておいたセーブコードを貼って「このコードで再開」。'; $('codeCopy').hidden = !S.created; if (fromTitle) { $('codem').hidden = false; } else openModal('codem'); }
$('codeCopy').addEventListener('click', () => { const t = $('codeT'); t.focus(); t.select(); const done = () => { $('codeMsg').textContent = 'コピーした。'; }; try { navigator.clipboard.writeText(t.value).then(done, () => { $('codeMsg').textContent = '文字を長押しして、手でコピーしてほしい。'; }); } catch (e) { $('codeMsg').textContent = '文字を長押しして、手でコピーしてほしい。'; } });
$('codeLoad').addEventListener('click', () => { if (loadCode($('codeT').value)) { $('codem').hidden = true; resume(); toast('セーブコードから再開した'); save(); } else $('codeMsg').textContent = 'このコードは読めなかった。貼り間違いがないか見てほしい。'; });
$('bCode').addEventListener('click', () => openCode(true));
function resume() { rebuildHero(); rebuildPickups(); rebuildChests(); syncPet(); $('title').hidden = true; $('create').hidden = true; $('menu').hidden = true; $('shop').hidden = true; paused = false; startPlay(false); }
$('bPose').addEventListener('click', () => { photoPose = (photoPose + 1) % 4; $('bPose').textContent = 'ポーズ：' + ['なし', '手をふる', 'ばんざい', '腰に手'][photoPose]; });

$('codeClose').addEventListener('click', () => { $('codem').hidden = true; if (mode !== 'title') closeModals(); });

/* ---------- 起動 ---------- */
let npc = null;
buildWorld();
npc = buildHuman({ skin: 3, hair: 5, bang: 2, hairC: 0, eye: 0, outfit: 2, outC: 1, accC: 0, sil: 0, build: 2, height: 0 }, { npc: true, hat: true }); npc.root.position.set(9, 0, 8.6); scene.add(npc.root); colliders.push({ x: 9, z: 8.6, r: 0.5 });
rebuildHero(); buildPickups(); rebuildChests(); syncPet(); hero.root.position.set(0, 0, 16); hero.root.rotation.y = PI;
if (window.matchMedia && matchMedia('(pointer: coarse)').matches === false) $('joyhint').textContent = 'WASD';
$('bCont').hidden = !hasSave; if (hasSave) $('bCont').textContent = 'つづきから（' + S.name + '　Lv' + S.lv + '）'; if (!storeOK) $('tnote').textContent = 'この開き方では端末に自動保存できません。手帳の「セーブコード」で控えを取れます。'; resize(); updateSky(0);
addEventListener('pagehide', () => save());
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const run = mode === 'play' && !paused;
  if (run || mode === 'photo' || mode === 'title') S.time = (S.time + dt * 24 / 600 * (mode === 'title' ? 0.4 : 1)) % 24;
  updateSky(dt);
  let g = dt; if (hitStop > 0) { hitStop -= dt; g = dt * 0.06; }
  if (run) { updatePlayer(g); updateSpawns(g, nightNow); updateEnemies(g); updateWorld(g); updatePet(g); animHero(g);
    if (S.autoPot && !P.dead && S.potions > 0 && S.hp > 0 && S.hp < maxHP() * 0.3) doPotion();
    hudT -= dt; if (hudT <= 0) { hudT = 0.2; updateHUD(); } saveT += dt; if (saveT > 12) { saveT = 0; save(); } }
  else if (mode === 'create' || mode === 'photo') { if (mode === 'create') { P.atk = null; P.fly = false; } animHero(dt); }
  updateFx(dt);
  updateCamera(dt);
  shadowPlane.position.x = P.x; shadowPlane.position.z = P.z; shadowPlane.visible = (QUAL[S.quality] || QUAL.mid).sh > 0;
  renderAll();
}
requestAnimationFrame(frame);
window.__terra = { get S() { return S; }, P, enemies, get mode() { return mode; }, setTime: t => { S.time = t; }, dbg: c => { rebuildHero(); dbgCam = c || null; } };
})();
